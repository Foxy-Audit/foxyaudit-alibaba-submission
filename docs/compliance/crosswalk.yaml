    clause: "164.308(a)(1)(ii)(D)"
    requirement: "Information system activity review (Required) — regularly review records of information system activity such as audit logs, access reports and security incident tracking reports."
    control: "Per-org hash-chained event ledger (backend/app/chain.py) plus the dashboard's grading and breach views."
    evidence: "A ledger export the customer pulls from GET /v1/logs/export and re-verifies with verifier/foxy_verify.py — dependency-free, no Foxy imports."
    status: partial
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
