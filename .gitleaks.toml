# Foxy Audit — gitleaks config. Keep the default rules; allowlist known-public tokens.
[extend]
useDefault = true

[allowlist]
description = "Public client-side-by-design tokens + doc placeholders that are safe to commit"
# The Build Week judge-evaluation password in seed_judges.py is deliberately
# committed and distributed to judges (see JUDGES.pdf). It also lives in
# history under the frozen tag `submission-openai-buildweek`, so the
# full-history scan will always re-find it there — a path allowlist is the
# only fix that doesn't rewrite history. Everything else stays fully scanned.
paths = [
  '''backend/scripts/seed_judges\.py''',
  # docs/video/*.html — DELETED from the tree 2026-08-25, allowlisted anyway,
  # for the same reason seed_judges.py is: the full-history scan re-finds the
  # blob in d6f24f61 forever and deleting the file changes nothing.
  #
  # ⚠ FALSE POSITIVES, verified before allowlisting rather than after. The two
  # findings are `aws-access-token` inside 7.4 MB of base64 MP4 data URIs — six
  # `src="data:video/mp4;base64,…"` attributes in one slide deck. Measured: the
  # file contains ZERO strings matching AKIA[0-9A-Z]{16}; gitleaks' rule also
  # covers ASIA/ABIA/ACCA/AGPA/AIDA/AIPA/ANPA/ANVA/AROA prefixes and caught a
  # random run inside the encoding. No credential was ever committed here.
  #
  # ⚠ WHY THIS MATTERED MORE THAN TWO FALSE POSITIVES: with the scan exiting 1
  # on every push, `secret-scan` was red on main for at least three days, so
  # the only automated guard behind "never commit secrets" could not have
  # reported a REAL leak. A permanently-failing guard reports nothing.
  '''docs/video/.*\.html''',
]
regexTarget = "line"
regexes = [
  # reCAPTCHA v2 SITE key — rendered in the browser by design. The SECRET key is
  # never committed (it lives in the server env as RECAPTCHA_SECRET_KEY).
  '''6LfaFFctAAAAAMFaCIzraQ3PYWJGuXgtTNcBglsr''',
  # Angle-bracket placeholders in docs/runbooks/examples (e.g. FOO=<KEY>,
  # ANCHOR_EVM_PRIVATE_KEY=<funded-sepolia-key>) are documentation stand-ins, never
  # real secrets. Needed because the full-history scan re-flags an old runbook commit
  # whose value predates the inline `# gitleaks:allow` marker added later.
  '''=\s*<[^>\n]{1,64}>''',
  # Deliberately-FAKE credentials embedded in the local secret-detector's OWN
  # test fixtures (sdk/tests/test_policy.py) and the no-LLM demo sandbox
  # (demo/mock_llm.py) so the detector has something to catch. Not real secrets:
  # sk-ABCDEF... is a placeholder and AKIAIOSFODNN7EXAMPLE is AWS's public doc key.
  '''AKIAIOSFODNN7EXAMPLE''',
  '''sk-ABCDEF0123456789ABCDEFGH''',
  # The compliance testbed's fixture for SDK #218 — the defect that
  # `secret.private_key` matches the BEGIN header alone, so redaction removes the
  # header and delivers the key BODY verbatim. Demonstrating that needs a
  # complete BEGIN/END block, which is the one shape gitleaks' `private-key` rule
  # requires (the older `sdk/tests/test_policy.py` fixture has no END marker,
  # which is why it never tripped this). The body below is 36 characters of
  # keyboard noise — it is not a key, and no key it resembles has ever existed.
  # ⚠ A path allowlist was rejected: it would stop scanning a whole file that
  # will keep growing. This pins the one fake body instead.
  '''MIIEowIBAAKCAQEAxKk9Lm2QpVrTbNc7YwH0''',
]
