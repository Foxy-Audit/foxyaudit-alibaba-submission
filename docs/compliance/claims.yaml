  - id: backups-do-not-leave-qatar
    claim: "Backups are retained in the same region and do not leave Qatar."
    was_at: ["foxy-sale-page/privacy.html:175 (§8, the hosting bullet)"]
    verdict: delete
    regime: GDPR
    replaced_with: >-
      Both locations, stated: nightly dumps on the VM in Qatar for 14 days, and
      daily GCP disk snapshots in the EU multi-region for 14 days.
    scope: text
    must_not_match:
      - "[Bb]ackups are retained in the same region"
      - "backups?[^.]{0,60}do(?:es)? not leave Qatar"
      - "(?:backups?|snapshots?)[^.]{0,80}(?:stay|remain|are kept|are held|are stored)[^.]{0,30}(?:in|within) Qatar\\b(?![^.]{0,80}European Union)"
    why: >-
      ⚠ VAULT #294, AND THE SHARPEST LESSON OF THIS WHOLE PHASE. C2 corrected the
      hosting country and, in the very same bullet, published a NEW false
      residency sentence. Measured hours later: the GCP disk snapshots are in the
      `eu` multi-region, 5 of 5 sampled.
      ⚠ IT WAS A PLANNING ERROR, NOT A BUILDING ERROR. MAIN read
      deploy/backup.sh, saw it write to a path on the VM, and wrote "backups do
      not leave Qatar" into the plan as an established fact; the executor carried
      a stated fact faithfully onto the page. **The application layer is not the
      infrastructure layer.** backup.sh is what the REPO does; the snapshot
      schedule is what the PLATFORM does underneath it, and nothing in the repo
      mentions it. A residency claim has to be verified where the bytes are, not
      where the code puts them.
      The third pattern is the general form — any claim that backups stay in
      Qatar, unless the same sentence also names the European Union.

  - id: unqualified-us-scc-reliance
    claim: "Where personal data is transferred from the EEA, UK, or Switzerland to the United States, we rely on the EU Standard Contractual Clauses ... as our transfer mechanisms."
    was_at: ["foxy-sale-page/privacy.html:210 (§13, Transfers to the United States)"]
