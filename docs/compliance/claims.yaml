open_questions:

  - id: qatar_transfer_mechanism
    question: "What Article 46 GDPR safeguard covers the EEA/UK/Swiss -> Qatar transfer?"
    status: TBD-LEGAL
    blocks: "privacy.html §13's 'Transfers to Qatar' paragraph naming a mechanism"
    why: >-
      GDPR-009 is `gap`: no Art. 46 instrument exists for this leg. The page
      says so plainly rather than naming one, because naming an unexecuted
      mechanism is what the old paragraph did. The plan's C1 item 3 owns the
      drafting (SCCs plus a transfer impact assessment); the sentence gets
      rewritten when there is something true to put in it.

  - id: us_leg_scc_execution
    question: "Have the EU Standard Contractual Clauses actually been executed for the EEA -> US leg?"
    status: UNVERIFIED
    blocks: "nothing on this branch — the sentence was already published and C2 left it exactly as it was"
    why: >-
      ⚠ RECORDED SO IT IS NOT MISTAKEN FOR SOMETHING C2 CHECKED. privacy.html
      §13 has always said "we rely on the EU Standard Contractual Clauses" for
      transfers to the United States. That leg is real — Google, OpenAI,
      Paddle, Payoneer and Google Identity are all US — so unlike the Qatar
      sentence it is not addressed to a destination that does not exist.
      But whether Foxy executed Google Cloud's and OpenAI's DPAs (both of which
      incorporate the SCCs as standard) cannot be verified from this repo.
      C2 neither strengthened nor weakened the sentence. C1 should confirm it,
      and if it turns out to be unexecuted this becomes a second false
      statement of the same kind as the one this branch fixes.

  - id: ccpa_has_no_rows
    question: "CCPA/CPRA is named on four surfaces and has no regime in crosswalk.yaml."
    status: OPEN
    blocks: "nothing today — the claims are about not selling data and are implemented"
    why: >-
      C0 recorded this and C0b did not close it: C0b's scope was the four
      regimes privacy.html §14 named without rows, plus PDPL. CCPA is the same
      shape of hole one regime over. Six entries here are backed by GDPR rows
      standing in, which is honest but is not the same as having rows.

  - id: gulf_absent_from_section_14
    question: "privacy.html §14 lists rights by region and names no Gulf jurisdiction, while there are live Saudi and UAE customers."
    status: OPEN
    blocks: "KSA-005 and UAE-006 moving off `gap`"
    why: >-
      ⚠ A DELIBERATE C2 SCOPE EXCLUSION, NOT AN OVERSIGHT. The brief scoped C2
      to the residency correction, the SOC 2 sentence and the guards. Adding a
      Gulf bullet to §14 is new legal copy about jurisdictions whose primary
      texts C0b could not fully reach (SDAIA blocks automated fetches), and it
      belongs with C1's DPA work where a lawyer sees it.
      What makes the omission a near miss rather than a false claim: §14 opens
      with "We do not limit these rights to any one region" and closes with a
      general commitment that applies "regardless of where you are located".
      The rights are extended. What is missing is the reader in Riyadh or Dubai
      seeing their own jurisdiction named — which UAE Art. 13 arguably requires.
