# Foxy Audit — the compliance claims register
#
# Phase C2 of docs/plans/compliance-program.md. READ docs/compliance/README.md
# for what a crosswalk row id means before trusting a `backing` here.
#
# WHAT THIS FILE IS FOR, AND WHY IT IS NOT A LIST OF STRINGS TO GREP
#
# foxy-sale-page/test_site_wide_claims.py already proves the three sub-processor
# lists AGREE with each other. On 2026-09-01 they agreed, and all three were
# wrong: every one of them stated the hosting country as the United States while
# production ran in GCP me-central1, Doha, Qatar. A consistency guard over false
# content reads green, because it cannot be wrong about its own subject.
#
# So this file records what is TRUE, not what is consistent:
#
#   assertions:  single-valued facts every surface must agree WITH. The guard
#                compares the pages to the value here, not to each other.
#   claims:      every regime word on every customer-facing surface, one entry
#                per (file, line, regime), each with a verdict and a crosswalk
#                row that backs it.
#   retired:     claims C2 removed, each pinning a pattern that must never come
#                back. The SOC 2 sentence is here because the vault records it
#                being softened once before — this is a recurrence, so it is
#                pinned rather than merely edited.
#
# The guard is foxy-sale-page/test_compliance_claims.py. It fails the build.

meta:
  phase: C2
  written: "2026-09-01"
  verified_against: "e7e1919"       # origin/main the branch was cut from
  branch: "feat/compliance-c2"
  written_by: "executor chat, per docs/plans/compliance-program.md §4 C2"
  legal_review: "NONE — no wording in this file or on the pages it governs has been reviewed by a lawyer"
  surfaces: ["foxy-sale-page/", "foxy-dashboard/"]
  not_a_surface: >-
    foxy-adminpage/ is a staff operations console, not a customer-facing
    surface, and is deliberately out of scope. If it ever becomes
    customer-visible it has to be added to meta.surfaces and re-scanned.
  freeze: >-
    ⚠ Nothing on this branch reaches the real repo before 2026-09-18. That is
    the owner's decision, recorded in docs/plans/compliance-program.md §9.3 and
    in the vault. The corrections below are FINISHED and waiting, so that date
    is a merge and not a project. Do not re-open it.

# ---------------------------------------------------------------------------
# ASSERTIONS
#
# Single-valued facts. The guard checks the PAGES against these values. There
# is exactly one right answer per key and it is written here, so a page that
# agrees with the other pages and disagrees with reality still fails.
# ---------------------------------------------------------------------------
assertions:

  hosting_country:
    value: "Qatar"
    detail: "Google Cloud region me-central1, Doha, Qatar"
    established: "owner, from the GCP console, 2026-09-01; recorded in the vault at 'Compliance — operating facts'"
    must_appear_on:
      - "foxy-sale-page/privacy.html"      # §8 sub-processor list, §13 transfers
      - "foxy-sale-page/trust.html"        # §6 sub-processor table
    #: Countries that MAY appear beside a provider on those pages, because a
    #: real sub-processor is there. Any other country next to a hosting word is
    #: the old defect coming back.
    other_provider_countries:
      ["United States", "European Union", "France", "Global (UK-headquartered)"]
    #: ⚠ EXEMPTIONS ARE EXACT SENTENCES, NOT A WILDCARD.
    #: A sentence that says where data is NOT hosted is not a statement of the
    #: hosting country, and the guard cannot tell the two apart from the words
    #: alone. So each one is pinned here in full: change a comma in it and the
    #: exemption stops applying and the guard fires again. That is the property
    #: an "ignore sentences containing not" rule would not have — under that
    #: rule, "our servers are not in the United States, they are in Ireland"
    #: would sail through.
    sentence_exemptions:
      - sentence: "We do not process personal data in Pakistan — our operating company is incorporated there ( Section 1 ), but no customer data is currently hosted or processed on Pakistani servers."
        why: >-
          §13. A NEGATIVE hosting statement — it says no customer data is
          hosted in Pakistan, which is true and is there because the operating
          company is incorporated there. It names a place beside a hosting word
          without asserting that place as the hosting country.
    #: The exact defect that was live until this branch. Never again, on any page.
    must_not_match:
      - 'hosting provider \(Google Cloud, Ubuntu VM\)</strong> — United States'
      - '<td>Google Cloud \(Ubuntu VM\)</td><td>Hosting</td><td>United States</td>'
      - 'data is processed in the <strong>United States</strong> \(our hosting provider'

  soc2_status:
    value: "no auditor engaged"
    detail: >-
      Foxy holds no SOC 2 report of any type and no auditor is engaged. SOC 2
      Type I is intended with no date attached. trust.html:151 is the canonical
      wording and the other pages defer to it.
    established: "foxy-sale-page/trust.html §7, unchanged since before this phase; confirmed against the repo and the vault 2026-09-01"
    canonical_page: "foxy-sale-page/trust.html"

# ---------------------------------------------------------------------------
# REGIME WORDS
#
# The vocabulary the guard scans for. Adding a regime word here without adding
# its claim entries below makes the build red, which is the point: a new regime
# cannot appear on a page without someone writing down what backs it.
#
# ⚠ THE SCAN MUST IGNORE data: URIs. These files embed base64 image payloads,
# and the letter sequences `pci`, `PDPL`, `NIST` and `LGPD` occur inside them.
# A naive grep reports claims on pages that make none — C0 measured this.
# ---------------------------------------------------------------------------
regime_words:
  HIPAA:        '\bHIPAA\b|(?<=["''])hipaa(?:_basic)?(?=["''])|\bhipaa\b'
  SOC 2:        '\bSOC ?2\b|(?<=["''])soc2(?=["''])'
  SOC 1:        '\bSOC ?1\b'
  GDPR:         '\bGDPR\b|(?<=["''])gdpr(?:_basic)?(?=["''])|\bgdpr\b'
  EU AI Act:    '\bEU AI Act\b|\bAI Act\b|(?<=["''])eu_ai_act(?=["''])|\beu_ai_act\b'
  NIST AI RMF:  '\bNIST\b|\bAI RMF\b'
  PCI DSS:      '\bPCI[- ]?DSS\b|\bPCI\b|(?<=["''])pci(?=["''])|\bpci\b'
  ISO 27001:    '\bISO ?27001\b'
  CCPA/CPRA:    '\bCCPA\b|\bCPRA\b'
  LGPD:         '\bLGPD\b'
  PIPEDA:       '\bPIPEDA\b'
  PDPA (SG):    '\bPDPA\b'
  PDPL:         '\bPDPL\b'
  Privacy Act:  '\bPrivacy Act 1988\b|\bPrivacy Act\b'
  FedRAMP:      '\bFedRAMP\b'
  SOX:          '(?<=["''])sox(?=["''])|\bSOX\b|\bsox\b'
  Qatar Law 13: '\bLaw No\.? 13\b|\bLaw 13/2016\b|\bPDPPL\b'

# ---------------------------------------------------------------------------
# CLAIMS
#
# One entry per (file, line, regime) site the scanner finds. Every site needs
# one; an unregistered site fails the build.
#
# kind:
#   affirmative   the surface asserts something. MUST carry a backing row.
#   negation      the surface says Foxy does NOT have something. Needs no
#                 backing — a crosswalk row cannot support an absence, and
#                 demanding one would push these sentences off the pages.
#   question      an FAQ heading. Answered by the affirmative entry beside it.
#
# verdict:
#   backed        a crosswalk row supports it as written
#   qualified     true, but it overclaims or misleads as written; the entry says how
#   delete        not true, or not supportable — and therefore NOT in this list.
#                 A live claim may not carry this verdict. Deletions live under
#                 `retired`, which is what proves they were applied.
#
# anchor: a distinctive substring of the line, used by the guard to find the
#         claim without depending on the line number staying put.
# ---------------------------------------------------------------------------
