# Foxy Audit — regime crosswalk
#
# Phase C0 of docs/plans/compliance-program.md. READ docs/compliance/README.md
# BEFORE READING OR EDITING THIS FILE — it defines what each status word means
# and what may be written into `evidence`. The definitions are narrower than
# they look.
#
# ⚠ THE ONE RULE: never write a clause number you have not verified against a
# real source. `clause: TBD` with `status: gap` is a correct answer. An invented
# article number is a defect, and this file will be read as authoritative.

meta:
  phase: "C0 + C0b"
  written: "2026-09-01"
  verified_against: "e7e1919"        # origin/main at the time of the C0b pass
  written_by: "executor chats, per docs/plans/compliance-program.md §4 C0 and C0b"
  c0b: >-
    C0b (2026-09-01, same day) closed the completeness hole C0 recorded in
    surface_claims: LGPD, PIPEDA, Singapore PDPA and the Australian Privacy Act
    were named on privacy.html §14 with no rows, and PDPL had no data-subject
    rights rows while Gulf customers were live. The owner chose rows over
    removing the names. C0b added 4 regimes and 25 rows, RESOLVED one of C0's
    four `clause: TBD` values (UAE-003 -> Art. 9) against the official UAE text,
    upgraded UAE-001 and UAE-002 from secondary sources to primary, and
    NARROWED UAE-002, which cited the adequate-protection transfer article for a
    transfer where protection is not adequate. It resolved no other TBD: see
    KSA-004's note for a source that looked like corroboration and was not.
  legal_review: "NONE — this file is engineering research, not legal advice"
  scope: >-
    Maps regulatory clauses onto Foxy controls and onto evidence a third party
    could inspect. It is a planning artefact. It is not a compliance claim, it
    is not a certification, and no row in it has been reviewed by a lawyer.
  hard_facts:
    # Established before this file was written; do not re-derive them here.
    hosting: "GCP me-central1-a — Doha, Qatar. No EU adequacy decision for Qatar."
    backups: "deploy/backup.sh writes to deploy/backups ON THE PRODUCTION VM, RETENTION_DAYS default 14."
    baa: "No BAA exists anywhere in the repo, the sale page or the vault (searched 2026-09-01)."
    platform_keys: "backend/app/judge_routing.py platform_keys_allowed() lets Foxy's OWN provider keys carry customer event metadata to OpenAI and Google."
    policy_tags: "sdk/src/foxy_audit/policy.py KNOWN_POLICY_TAGS = {default, soc2, hipaa, gdpr} + aliases {hipaa_basic, gdpr_basic}. _POLICY_EXTRA maps soc2 -> () — baseline only."
    judge_limit: "The AI judge sees only hashes and counts. It CANNOT assess maliciousness. No row here may imply otherwise."
    company: "Foxy is incorporated in Pakistan. Two people. No legal budget yet."

# ---------------------------------------------------------------------------
# REGIMES
#
# posture:
#   CLAIMED      a customer-facing surface names this regime today
#   MAPPED-ONLY  mapped here for planning; no customer-facing surface names it
#
# Posture is about what we SAY, not about what we have. Every regime below is
# one Foxy the company is certified in exactly none of.
# ---------------------------------------------------------------------------
regimes:
  - id: HIPAA
    name: "Health Insurance Portability and Accountability Act — Security Rule, Breach Notification Rule (45 CFR Part 164)"
    posture: CLAIMED
    role: >-
      If a customer sends PHI through the SDK, Foxy is a business associate.
      No BAA exists, so that relationship is currently un-papered.
    named_on: ["foxy-sale-page/install.html", "foxy-sale-page/how-it-works.html", "foxy-sale-page/welcome.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: SOC2
    name: "AICPA Trust Services Criteria (2017, with revised points of focus 2022)"
    posture: CLAIMED
    role: >-
      An organisational control regime. It is NOT a per-call policy and can
      never be one — see the `soc2` vocabulary rows below.
    named_on: ["foxy-sale-page/faq.html", "foxy-sale-page/pricing.html", "foxy-sale-page/trust.html", "foxy-sale-page/privacy.html", "foxy-sale-page/how-it-works.html", "foxy-sale-page/install.html", "foxy-sale-page/sdk.html"]

  - id: GDPR
    name: "Regulation (EU) 2016/679"
    posture: CLAIMED
    role: "Foxy is a processor for customer workspace data; a controller for account data."
    named_on: ["foxy-sale-page/privacy.html", "foxy-sale-page/dpa.html", "foxy-sale-page/cookie-policy.html", "foxy-sale-page/index.html", "foxy-sale-page/install.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: EU_AI_ACT
    name: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    posture: CLAIMED
    role: >-
      Foxy is not a provider or deployer of a high-risk AI system. It is a
      record-keeping tool a deployer can use toward Art. 26(6). Provider
      obligations are not-applicable to Foxy itself.
    named_on: ["foxy-sale-page/passport.html", "foxy-sale-page/docs.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: NIST_AI_RMF
    name: "NIST AI Risk Management Framework 1.0"
    posture: CLAIMED
    role: >-
      NOT one of the eight regimes C0 was scoped to map. It is here because two
      customer-facing pages claim the Compliance Passport is mapped to it and
      the Passport template contains zero NIST references. See surface_claims.
    named_on: ["foxy-sale-page/passport.html", "foxy-sale-page/docs.html"]

  - id: PDPL_KSA
    name: "Saudi Personal Data Protection Law (Royal Decree M/19, as amended)"
    posture: MAPPED-ONLY
    role: "Live Gulf customers exist. The published privacy policy does not cover PDPL."
    named_on: []

  - id: PDPL_UAE
    name: "UAE Federal Decree-Law No. 45 of 2021 on the Protection of Personal Data"
    posture: MAPPED-ONLY
    role: "Live Gulf customers exist. The published privacy policy does not cover PDPL."
    named_on: []

  - id: QATAR_13_2016
    name: "Qatar Law No. 13 of 2016 Concerning Personal Data Privacy Protection (PDPPL)"
    posture: MAPPED-ONLY
    role: >-
      Reaches Foxy through HOSTING, not through customers: production runs in
      GCP me-central1-a, Doha. Whether hosting alone triggers obligations is a
      legal question and is TBD.
    named_on: []

  - id: PCI_DSS
    name: "PCI DSS v4.0.1"
    posture: CLAIMED
    role: >-
      Foxy is not a merchant, not a service provider in a cardholder data
      environment, and stores no account data. The claim surface is a single
      dashboard string naming a `pci` tag the SDK does not recognise.
    named_on: ["foxy-dashboard/foxy-audit-premium.html"]

  - id: ISO_27001
    name: "ISO/IEC 27001:2022"
    posture: CLAIMED
    role: "Named only in the negative and as a roadmap item. Not certified."
    named_on: ["foxy-sale-page/trust.html", "foxy-sale-page/privacy.html"]

  - id: LGPD
    name: "Brazil — Lei Geral de Proteção de Dados Pessoais, Lei nº 13.709/2018"
    posture: CLAIMED
    role: >-
      Foxy is an "operador" (processor) for customer workspace data and a
      "controlador" for account data — the same split as GDPR. Named on
      privacy.html §14 since long before this crosswalk existed.
    named_on: ["foxy-sale-page/privacy.html"]

  - id: PIPEDA
    name: "Canada — Personal Information Protection and Electronic Documents Act (S.C. 2000, c. 5)"
    posture: CLAIMED
    role: >-
      PIPEDA does not use the controller/processor split. It makes an
      organisation accountable for personal information "in its possession or
      custody, including information that has been transferred to a third party
      for processing" (Sch. 1, cl. 4.1.3) — which is exactly the platform-key
      leg that content-blindness does not cover.
    named_on: ["foxy-sale-page/privacy.html"]

  - id: PDPA_SG
    name: "Singapore — Personal Data Protection Act 2012 (2020 Rev. Ed.)"
    posture: CLAIMED
    role: >-
      Foxy is a "data intermediary" — it processes personal data on behalf of
      and for the purposes of another organisation. That status carries a duty
      of its own under s. 26C(3)(a), and it is the sharpest PDPA row here.
    named_on: ["foxy-sale-page/privacy.html"]

  - id: AU_PRIVACY
    name: "Australia — Privacy Act 1988 (Cth), Schedule 1 (Australian Privacy Principles) and Part IIIC (Notifiable Data Breaches)"
    posture: CLAIMED
    role: >-
      Whether Foxy is an "APP entity" at all turns on the small-business
      exemption and the Australian-link test. That is a legal question and is
      TBD; the rows below map the obligations that bind if it is one.
    named_on: ["foxy-sale-page/privacy.html"]

  - id: SOC1
    name: "SSAE 18 SOC 1 (ICFR)"
    posture: MAPPED-ONLY
    role: "NOT APPLICABLE. Reasoning lives in docs/compliance/not-applicable.md."
    named_on: []

# ---------------------------------------------------------------------------
# SURFACE CLAIMS
#
# Every regime word found on a customer-facing surface, and where it lands.
# Found with:
#   grep -ril "HIPAA\|SOC 2\|GDPR\|PCI\|ISO 27001\|FedRAMP\|CCPA\|NIST" \
#        foxy-sale-page/ foxy-dashboard/
# then re-run per word with word boundaries, because base64 image payloads in
# these files contain the letter sequences "pci", "PDPL" and "NIST" and a naive
# grep reports them as claims.
#
# verdict:
#   backed      a crosswalk row supports the claim as written
#   qualify     true but overclaims as written; C2 should narrow it
#   delete      not true, or not supportable; C2 should remove it
# ---------------------------------------------------------------------------
surface_claims:
  - claim: "We're currently completing our SOC 2 Type I audit."
    where: "foxy-sale-page/faq.html:60 and foxy-sale-page/pricing.html:121"
    verdict: delete
    why: >-
      foxy-sale-page/trust.html:151 says the opposite on the same site: "SOC 2
      Type I — intended, but no auditor is engaged yet, so we are not putting a
      date on it." Two pages cannot both be true. "Completing an audit" with no
      engaged auditor is not a qualification, it is a false statement of fact.
    regime: SOC2

  - claim: "Infrastructure / hosting provider (Google Cloud, Ubuntu VM) — United States."
    where: "foxy-sale-page/privacy.html:175, and the same row in foxy-sale-page/trust.html:144"
    verdict: delete
    why: >-
      ⚠ FOUND BY THIS PHASE, NOT ANTICIPATED BY THE PLAN. Production runs in GCP
      me-central1-a — Doha, Qatar. The published privacy policy and the trust
      page both state the hosting region as the United States. This is a
      factually wrong residency statement on a legal page, live today, and it
      is load-bearing for GDPR Art. 44-46: the transfer actually being made is
      EEA -> Qatar, a country with no adequacy decision, and neither page
      mentions it.
    regime: GDPR

  - claim: "Your data is processed in the United States (our hosting infrastructure, Google, OpenAI, and Paddle) and the European Union (Brevo). ... Where personal data is transferred from the EEA, UK, or Switzerland to the United States, we rely on the EU Standard Contractual Clauses..."
    where: "foxy-sale-page/privacy.html:208-209 (§13 International Data Transfers)"
    verdict: delete
    why: >-
      Same defect, one section further on, and worse: it names a transfer
      mechanism for a destination that is not the actual destination. The Art.
      46 safeguard for the EEA -> Qatar leg is not stated because the leg is not
      disclosed. C1 owns the fix (SCCs + a transfer impact assessment); C2 owns
      the page.
    regime: GDPR

  - claim: "Mapped to standards: aligned to NIST AI RMF and the EU AI Act so reviewers recognize it on sight."
    where: "foxy-sale-page/passport.html:36, and passport.html:7 / docs.html:68 in the same words"
    verdict: delete
    why: >-
      backend/app/templates/compliance_passport.html contains zero occurrences
      of "NIST", "AI RMF", "AI Act" or any clause number (grep -c, 2026-09-01).
      The Passport is grouped by policy_tag. Nothing in it is mapped to a
      standard. C3 is the phase that could make this claim true; until it does,
      the claim has nothing behind it.
    regime: NIST_AI_RMF

  - claim: "Any interaction tagged pci, sox, hipaa, gdpr or eu_ai_act is risk-scored 60 or higher unless it is clearly compliant."
    where: "foxy-dashboard/foxy-audit-premium.html:2360 (Regulated data mode — HIPAA / financial)"
    verdict: qualify
    why: >-
      Three of the five tags named — `pci`, `sox`, `eu_ai_act` — are not in the
      SDK's KNOWN_POLICY_TAGS. A customer may pass them as free strings (the SDK
      warns once per unknown tag), so the sentence is not false; but a
      dashboard listing them beside `hipaa` and `gdpr` reads as four regime
      modes where two exist. This is the only surface where the word "pci"
      appears at all.
    regime: PCI_DSS

  - claim: "@foxy.audit(policy=\"soc2\")"
    where: "foxy-sale-page/how-it-works.html:38, foxy-sale-page/sdk.html:38, foxy-sale-page/install.html:58"
    verdict: qualify
    why: >-
      _POLICY_EXTRA maps "soc2": () — baseline injection and secret checks only,
      no SOC 2-specific rule. The code is right and the vocabulary is wrong: SOC
      2 is an organisational control regime and cannot be a per-call check. The
      example is not a false claim, but the tag name implies a check that does
      not and cannot exist. C2 owns the vocabulary fix.
    regime: SOC2

  - claim: "@foxy.audit(policy=\"hipaa\")"
    where: "foxy-sale-page/install.html:54, foxy-sale-page/welcome.html:88 (as hipaa_basic)"
    verdict: backed
    why: >-
      `hipaa` -> ("phi",) is a real detection family and mode=\"block\" genuinely
      stops the model call before it is made. What it does NOT establish is that
      Foxy may lawfully receive PHI — that needs a BAA, which does not exist.
      Backed as a product claim; see the HIPAA gap rows for the company claim.
    regime: HIPAA

  - claim: "Its verdict is a review signal — not a HIPAA or SOC 2 certification — and unavailable judge results remain visibly unknown."
    where: "foxy-sale-page/how-it-works.html:56"
    verdict: backed
    why: "A disclaimer, and an accurate one. This is the sentence other pages should sound like."
    regime: SOC2

  - claim: "We do not currently hold SOC 2, ISO 27001, or a comparable third-party attestation."
    where: "foxy-sale-page/trust.html:150 and foxy-sale-page/privacy.html:177"
    verdict: backed
    why: "True, and stated plainly. Nothing to change."
    regime: ISO_27001

  - claim: "Roadmap: ISO 27001 gap analysis — Q2 2027. SOC 2 Type I — intended, but no auditor is engaged yet, so we are not putting a date on it."
    where: "foxy-sale-page/trust.html:151"
    verdict: backed
    why: "True. It is also the sentence that makes faq.html:60 and pricing.html:121 indefensible."
    regime: SOC2

  - claim: "EU / EEA / UK (GDPR): analytics is off until you opt in ... California (CCPA/CPRA): we don't sell or share personal information"
    where: "foxy-sale-page/cookie-policy.html:116-117, foxy-sale-page/index.html:1389-1460, and foxy-sale-page/dpa.html:99 (which defines the controller/processor split in CCPA/CPRA terms as well as GDPR terms)"
    verdict: backed
    why: >-
      A geo-aware consent gate that is actually implemented in index.html. The
      claim is about cookies, not about certification.
    regime: GDPR

  - claim: "Rights lists for Brazil (LGPD), Canada (PIPEDA), Singapore (PDPA), Australia (Privacy Act 1988)"
    where: "foxy-sale-page/privacy.html:223, :224, :225"
    verdict: backed
    why: >-
      ✓ RESOLVED BY C0b, 2026-09-01. C0 recorded this as `qualify` for one
      reason only — the four regimes were named on a live legal page and had no
      rows here — and offered the owner "give them rows or stop naming them".
      The owner chose rows. LGPD-005, PIPEDA-001, SGP-001 and AUS-001 and their
      neighbours now exist, so the contingency that made this a `qualify` is
      gone and the verdict is `backed`: §14 promises access, correction,
      deletion and export, and those mechanisms are real and exercisable.
      ⚠ What C0b did NOT close: the same section still names no Gulf
      jurisdiction while there are live Saudi and UAE customers. See KSA-005 and
      UAE-006, both `gap`, and the deliberate scope exclusion recorded in
      docs/compliance/claims.yaml.
    regime: null

  - claim: "FedRAMP"
    where: null
    verdict: backed
    why: "Zero occurrences on any customer-facing surface. Nothing to resolve."
    regime: null

# ---------------------------------------------------------------------------
# ROWS
#
# status: met | partial | gap | not-applicable
#   met            the requirement is discharged AND a third party can inspect
#                  the evidence that says so. THERE ARE ZERO `met` ROWS. That is
#                  not modesty; see README.md "Why nothing is met".
#   partial        a real control exists and does real work, but either it does
#                  not discharge the clause on its own or no third party can
#                  inspect it.
#   gap            no control, or a control that fails the clause.
#   not-applicable the clause cannot bind Foxy. Every one carries its reasoning.
#
# control:  what Foxy does. May name closed-source code.
# evidence: what an OUTSIDE party could obtain and inspect. A path into the
#           private backend is NOT evidence — it is a control. null is common
#           and is the honest answer.
# ---------------------------------------------------------------------------
rows:

  # ---------------------------------------------------------------- HIPAA ---
  - id: HIPAA-001
    regime: HIPAA
    clause: "164.308(a)(1)(ii)(D)"
    requirement: "Information system activity review (Required) — regularly review records of information system activity such as audit logs, access reports and security incident tracking reports."
    control: "Per-org hash-chained event ledger (backend/app/chain.py) plus the dashboard's grading and breach views."
    evidence: "A ledger export the customer pulls from GET /v1/logs/export and re-verifies with verifier/foxy_verify.py — dependency-free, no Foxy imports."
    status: partial
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
    notes: "The ledger makes review possible. Nothing evidences that a review is actually PERFORMED on a schedule — that is a C4 control, not a product feature."

  - id: HIPAA-002
    regime: HIPAA
    clause: "164.308(a)(2)"
    requirement: "Assigned security responsibility — identify the security official responsible for developing and implementing the policies and procedures required by this subpart."
    control: null
    evidence: null
    status: gap
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
    notes: "Two-person team; no named security official recorded anywhere. Cheap to close and it is a question every questionnaire opens with."

  - id: HIPAA-003
    regime: HIPAA
    clause: "164.308(a)(5)"
    requirement: "Security awareness and training — implement a security awareness and training program for all workforce members."
    control: null
    evidence: null
    status: gap
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
    notes: "C4 scope."

  - id: HIPAA-004
    regime: HIPAA
    clause: "164.308(a)(6)(ii)"
    requirement: "Response and reporting (Required) — identify and respond to suspected or known security incidents; mitigate harmful effects; document incidents and their outcomes."
    control: null
    evidence: null
    status: gap
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
    notes: "No incident-response plan exists. C1 deliverable 6."

  - id: HIPAA-005
    regime: HIPAA
    clause: "164.308(a)(7)(ii)(A)"
    requirement: "Data backup plan (Required) — establish and implement procedures to create and maintain retrievable exact copies of electronic protected health information."
    control: "deploy/backup.sh — nightly pg_dump plus an avatar tarball, RETENTION_DAYS default 14."
    evidence: null
    status: partial
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
    notes: "Copies exist. They are written to deploy/backups ON THE PRODUCTION VM, so they share a failure domain with the database they protect."

  - id: HIPAA-006
    regime: HIPAA
    clause: "164.308(a)(7)(ii)(B)"
    requirement: "Disaster recovery plan (Required) — establish and implement procedures to restore any loss of data."
    control: "A restore recipe in the header comment of deploy/backup.sh."
    evidence: null
    status: gap
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
    notes: "A comment is not a plan. Lose the VM and both the database and every dump go together."

  - id: HIPAA-007
    regime: HIPAA
    clause: "164.308(a)(7)(ii)(D)"
    requirement: "Testing and revision procedures (Addressable) — implement procedures for periodic testing and revision of contingency plans."
    control: null
    evidence: null
    status: gap
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
    notes: "No record of a restore ever having been performed. An untested backup is a belief, not a control."

  - id: HIPAA-008
    regime: HIPAA
    clause: "164.308(b)(1)"
    requirement: "Business associate contracts and other arrangements — a covered entity may permit a business associate to create, receive, maintain or transmit ePHI on its behalf only if it obtains satisfactory assurances, per 164.314(a), that the business associate will appropriately safeguard it."
    control: null
    evidence: null
    status: gap
    source: "45 CFR 164.308, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.308 (fetched 2026-09-01)"
    notes: "⚠ THE SHARPEST SINGLE GAP. No BAA exists in the repo, the sale page or the vault. There are live healthcare customers. C1 deliverable 1."

  - id: HIPAA-009
    regime: HIPAA
    clause: "164.312(a)(2)(i)"
    requirement: "Unique user identification (Required) — assign a unique name and/or number for identifying and tracking user identity."
    control: "Per-user accounts (backend/app/auth.py); staff console sessions signed with a secret distinct from the customer app's."
    evidence: null
    status: partial
    source: "45 CFR 164.312, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.312 (fetched 2026-09-01)"
    notes: "Implemented; nothing an external party can inspect."

  - id: HIPAA-010
    regime: HIPAA
    clause: "164.312(b)"
    requirement: "Audit controls — implement hardware, software and/or procedural mechanisms that record and examine activity in information systems that contain or use electronic protected health information."
    control: "Sequential per-org SHA-256 hash chain over event metadata (backend/app/chain.py); staff-action audit trail (backend/app/admin_audit.py, account_audit.py, admin_chain.py); optional EVM anchoring of the chain head."
    evidence: "An export plus `python verifier/foxy_verify.py logs.json`. The verifier is shipped, dependency-free, and recomputes the chain with zero Foxy imports, so the customer's auditor runs it without trusting us."
    status: partial
    source: "45 CFR 164.312, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.312 (fetched 2026-09-01)"
    notes: >-
      The strongest genuine row in this file, and still not `met`: Foxy's system
      does not contain ePHI (content-blindness), so what the chain evidences is
      activity ABOUT ePHI-bearing interactions, not the covered system itself.
      Whether the metadata is identifiable — and so itself PHI — is a legal
      question and is TBD.

  - id: HIPAA-011
    regime: HIPAA
    clause: "164.312(c)(1)"
    requirement: "Integrity — implement policies and procedures to protect electronic protected health information from improper alteration or destruction."
    control: "Hash chain; event_metadata bound into the chain hash; anchor receipts and the staff trail are read-only in the admin tools."
    evidence: "The verifier detects any post-hoc edit of an exported chain."
    status: partial
    source: "45 CFR 164.312, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.312 (fetched 2026-09-01)"
    notes: "Tamper-EVIDENT, not tamper-proof, and the distinction is the product's honest line."

  - id: HIPAA-012
    regime: HIPAA
    clause: "164.312(d)"
    requirement: "Person or entity authentication — implement procedures to verify that a person or entity seeking access to electronic protected health information is the one claimed."
    control: "backend/app/auth.py; backend/app/mfa.py; step-up authentication for sensitive staff actions; backend/app/ip_allow.py."
    evidence: null
    status: partial
    source: "45 CFR 164.312, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.312 (fetched 2026-09-01)"
    notes: null

  - id: HIPAA-013
    regime: HIPAA
    clause: "164.312(e)(1)"
    requirement: "Transmission security — implement technical security measures to guard against unauthorized access to electronic protected health information that is being transmitted over an electronic communications network."
    control: "TLS-terminating reverse proxy; the SDK never transmits raw prompt or response text at all — only hashes and bounded metadata."
    evidence: "The SDK is public on PyPI (foxy-audit) and its wire payload is a closed field list a customer can read and diff against what leaves their process."
    status: partial
    source: "45 CFR 164.312, Cornell LII — https://www.law.cornell.edu/cfr/text/45/164.312 (fetched 2026-09-01)"
    notes: "Content-blindness is the real control here, and it is a genuinely unusual one. It does not cover the platform-key leg — see HIPAA-015."

  - id: HIPAA-014
    regime: HIPAA
    clause: "164.314(a)(2)(i)(C)"
    requirement: "Business associate contract implementation specification — the contract must require the business associate to report to the covered entity any security incident of which it becomes aware, including breaches of unsecured protected health information."
    control: null
