# app-alibaba-submission / admin-alibaba-submission / checkout-alibaba-submission
# — the vhosts for the Alibaba Cloud AI Hackathon Pakistan 2026 submission stack.
#
###############################################################################
#                                                                             #
#  A SEPARATE FILE, ON PURPOSE. It is installed as its own                    #
#  sites-available/foxyaudit-alibaba.conf with its own symlink, and it NEVER   #
#  touches sites-available/foxyaudit.conf (production) or                     #
#  sites-available/foxyaudit-dev2.conf (the devtool stack).                   #
#                                                                             #
#  Why: on 2026-08-13 copying deploy/nginx-foxyaudit.conf over the live file  #
#  discarded every TLS block and took HTTPS down on all four production       #
#  vhosts — and `nginx -t` PASSED on the result. Keeping each environment's   #
#  sites in a file of its own means production's certificate bindings cannot  #
#  be lost by anything done here, and a rollback is `rm` one symlink +        #
#  reload.                                                                    #
#                                                                             #
#  THIS FILE IS PRE-CERTBOT: every block is `listen 80` with no               #
#  ssl_certificate. Install it, verify over HTTP, and only then run certbot   #
#  for the THREE submission names alone. Do NOT add the production names or   #
#  the dev2 names to that certbot run — they are on their own certificates    #
#  and must stay there.                                                       #
#                                                                             #
#  INSTALL:                                                                   #
#    sudo cp deploy/nginx-foxyaudit-alibaba.conf \                            #
#            /etc/nginx/sites-available/foxyaudit-alibaba.conf                #
#    sudo ln -s /etc/nginx/sites-available/foxyaudit-alibaba.conf \           #
#               /etc/nginx/sites-enabled/                                     #
#    sudo nginx -t && sudo systemctl reload nginx                             #
#                                                                             #
#  THEN, separately:                                                          #
#    sudo certbot --nginx \                                                   #
#      -d app-alibaba-submission.foxyaudit.tech \                             #
#      -d admin-alibaba-submission.foxyaudit.tech \                           #
#      -d checkout-alibaba-submission.foxyaudit.tech                          #
#                                                                             #
#  ROLLBACK (complete, at any point):                                         #
#    sudo rm /etc/nginx/sites-enabled/foxyaudit-alibaba.conf                  #
#    sudo nginx -t && sudo systemctl reload nginx                             #
#                                                                             #
#  TEARDOWN after judging: see deploy/ALIBABA_SUBMISSION_RUNBOOK.md           #
#                                                                             #
###############################################################################
#
# The submission backend is published loopback-only at 127.0.0.1:8087 by
# deploy/docker-compose.alibaba.yml. Production's is 8085 and dev2's is 8086;
# neither is referenced anywhere in this file.
#
# X-Forwarded-For is OVERWRITTEN with $remote_addr, never appended — identical
# to production, and not stylistic: the backend trusts this header for
# rate-limit keys, traffic ip_hash and the admin IP allow-list, so a client must
# not be able to inject its own. Appending would let it.

# ── Submission site 1 · customer dashboard ──────────────────────────────────
server {
    listen 80;
    server_name app-alibaba-submission.foxyaudit.tech;

    client_max_body_size 20m;

    location = / {
        return 302 /dashboard;
    }

    # The staff surface is never reachable via the customer hostname. Mirrors
    # production; dropping it would expose this stack's admin console here.
    location /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Submission site 2 · staff ops console ───────────────────────────────────
server {
    listen 80;
    server_name admin-alibaba-submission.foxyaudit.tech;

    location = / {
        return 302 /admin/;
    }

    # Nothing but the staff surface is served on the admin hostname.
    location /admin {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

# ── Submission site 3 · Paddle checkout ─────────────────────────────────────
# Static only, and deliberately NO proxy_pass — same as production: the one
# origin that runs third-party payment script has no route to the API at all.
#
# The CSP is byte-identical to production's. foxy-checkout/test_checkout_page.py
# fails if the Caddyfile and the nginx copy ever drift, so it is reproduced
# exactly rather than trimmed for this host.
server {
    listen 80;
    server_name checkout-alibaba-submission.foxyaudit.tech;

    root /home/devops/foxy-audit-alibaba/foxy-checkout;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.paddle.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.paddle.com; font-src 'self' data:; frame-src https://*.paddle.com https://paddle.com; connect-src https://*.paddle.com https://paddle.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ⚠ A SUBMISSION-ONLY PATH, and deliberately one that does not exist.
    #
    # Production aliases /home/devops/foxy-checkout-config/config.js, which holds
    # the LIVE Paddle client token. Pointing this host at that file would hand a
    # demo page production's payment configuration — exactly the coupling these
    # parallel environments exist to avoid.
    #
    # With the file absent nginx answers a clean 404 and the page renders its
    # unconfigured state, which is correct: PADDLE_API_KEY is blank in this
    # stack's env file, so there is no checkout to configure.
    #
    # It must NOT fall back to index.html — that would hand the browser HTML to
    # parse as JavaScript.
    location = /config.js {
        alias /home/devops/foxy-checkout-config-alibaba/config.js;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
