  pin_semantics: >-
    ⚠ ADDED BY C2-HARDEN 2026-09-02 FOR [[#307]]. `where` IS PROSE AND `pins` IS
    THE MACHINE-READABLE HALF. A pin is `{at: "<repo path>:<line>", text: "<a
    fragment of the claim>"}` and the guard asserts the fragment is still at that
    line.

    THE MATCH IS FORGIVING OF MARKUP AND STRICT ABOUT WORDS: tags stripped,
    entities resolved, whitespace squashed to nothing. Wrapping a phrase in
    <strong>, re-indenting a table cell or reflowing a paragraph does not fire the
    guard; changing what the sentence asserts does. That asymmetry is deliberate —
    a pin that breaks when somebody fixes a comma is a pin somebody deletes, and
    [[#307]] is a finding about a guard that was too weak, not one that was noisy.
    It also means a pin may be written against text that reads oddly in the source,
    because it is written against the line as a reader sees it: trust.html:144's
    pin spans two table cells.

    ⚠ PIN THE PART THAT CARRIES THE CLAIM, NOT THE SENTENCE. trust.html:151's pin
    is "SOC 2 Type I — intended, but no auditor is engaged yet" and stops short of
    "Q2 2027", because the date is a plan and may legitimately move while the
    claim does not.

    ⚠ `pins: null` IS ALLOWED IN EXACTLY TWO CASES, AND THE GUARD CHECKS WHICH.
    Either the claim is on no surface at all (`where: null` — FedRAMP), or the
    text was DELETED from this repo, in which case `retired_as` must name the
    `retired` entry in claims.yaml whose `must_not_match` pattern is what fails if
    it comes back. A `delete` verdict may not simply omit its pins: three of the
    four name text this repo no longer has, and skipping them would have left
    three entries unguarded in silence. Where the text cannot be pinned by line it
    is pinned by pattern instead, and the guard asserts the pattern's entry EXISTS.

    ⚠ A `delete` VERDICT IS STILL ABOUT THE CLAIM, NOT THE PIN. The hosting entry
    is `delete` and carries pins: its pins are the REPLACEMENT text, which is what
    makes an in-place rewrite back to a wrong country fail. Do not read a pin as
    an endorsement of the claim above it.
  line_number_semantics: >-
    ⚠ DECIDED BY C1-SYNC 2026-09-02, BECAUSE THE NUMBERS ARE DOWNSTREAM OF THE
    DECISION AND C3A'S CF-3 LEFT IT OPEN.

    `surface_claims[].where` NAMES A LOCATION IN THIS REPOSITORY, AT THE SHA IN
    `meta.verified_against`. Where C2 applied a verdict and the claim is no
    longer present at that SHA, `where` names the last SHA in this repo's
    history at which it WAS present, says which commit removed it, and says so
    in those words.

    The alternative was to track foxyaudit.tech, which still serves the
    uncorrected pages until the 2026-09-18 merge floor. It was rejected because
    nobody can check it. This repository has never held a copy of the frozen
    repo's tree, so a line number attributed to the live site would be an
    assertion about a tree we cannot read — the same defect as a clause number
    filled in from memory, one column over. Every number below is checkable with
    `git show <sha>:<path>`; a number attributed to a website is checkable by
    nobody.

    It also makes ONE rule serve both files: claims.yaml already tracks this
    repo, and foxy-sale-page/test_compliance_claims.py already fails the build
    on a stale number there
    (test_the_recorded_line_numbers_are_current).

    ⚠ AND NO VERDICT MOVED. A verdict is about the CLAIM, not about the line. A
    `delete` whose text this repo no longer contains is still `delete`, because
    foxyaudit.tech still serves it and the verdict describes what is published —
    which is why each such entry says "STILL LIVE" rather than quietly going
    quiet. Four `delete` verdicts stood before this pass and four stand after it.
    Every number was re-derived by script over `git show` at both e7e1919 and
    4466996; none was counted by hand, because C2b's own guard caught a
    hand-edited line number twice.
