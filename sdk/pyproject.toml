[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foxy-audit"
version = "1.14.0"
description = "Governance-as-Code SDK for AI compliance: local customer-keyed commitments, durable capture, and tamper-evident audit telemetry without raw-text exfiltration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Foxy Audit" }]
keywords = ["compliance", "audit", "ai", "governance", "hipaa", "soc2", "eu-ai-act"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# A library: bound the major (never exact-pin) so it stays co-installable in a
# consumer's environment. (Phase 5 · 5F)
dependencies = ["requests>=2.31,<3"]

# ⚠ EVERY URL HERE IS RENDERED ON THE PyPI PAGE AND CLICKED BY STRANGERS. A link
# that 404s is worse than an absent field: it reads as a maintained project that
# has rotted. All four of the previous entries were checked against the live web
# and three were dead —
#
#   Documentation -> foxyaudit.tech/docs.html   200, and titled "Documentation —
#     Foxy Audit", but its entire body is "Docs are on the way." / "Full docs
#     coming soon". The status code AND the title both looked fine; only reading
#     it showed there was nothing there. Dropped: this README, rendered on the
#     PyPI page itself, IS the SDK's documentation, so a field pointing away from
#     it at a placeholder was worse than none.
#   Source / Issues -> github.com/alikamran21/...   404, and the wrong owner
#     besides. The repository is `fatimaatta-09` and is PRIVATE, so no GitHub URL
#     can be a public route. Issues is dropped for the same reason: there is no
#     public issue tracker to point at, and inventing one would be worse.
#
# Source now points at the PyPI files listing, which is a real, public route to
# the MIT-licensed code: the release workflow publishes an sdist
# (`foxy_audit-<version>.tar.gz`) alongside the wheel, verified present on the
# live index. This matters beyond tidiness — the Privacy Policy §16 invites
# readers to review this SDK's source to check its data-minimisation claims for
# themselves, and until now that invitation had nowhere to land.
#
# Changelog -> the PyPI release history. There is no separate changelog file and
#   no changelog page on the site, because README.md IS the changelog: it opens
#   with a section per version and PyPI renders each release's own copy of it.
#   The history tab is the public index into those, so the field points at a
#   real route rather than at a page someone still has to write.
#
# ⚠ SECURITY.md CANNOT BE LINKED HERE, and Security is not an oversight. The
#   repository is private, so any URL into it 404s for the strangers who click
#   these — the exact failure the note above records, and one
#   foxy-sale-page/test_security_txt.py already asserts against this very file.
#   SECURITY.md itself names https://foxyaudit.tech/report-abuse.html as the
#   AUTHORITATIVE policy and exists only as its contributor-facing companion, so
#   the published page is not a substitute for the file — it is the file's own
#   designated public form, and it is what Security already points at.
[project.urls]
Homepage = "https://foxyaudit.tech"
Source = "https://pypi.org/project/foxy-audit/#files"
Changelog = "https://pypi.org/project/foxy-audit/#history"
Security = "https://foxyaudit.tech/report-abuse.html"

[project.scripts]
foxy = "foxy_audit.cli:main"

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]
# Deep NLP PII detection (names / locations / MRNs). Also needs a spaCy model:
#   python -m spacy download en_core_web_lg
pii = ["presidio-analyzer>=2.2", "spacy>=3.7"]

[tool.hatch.build.targets.wheel]
# foxy_testbed ships in the SAME wheel so that `pip install foxy-audit` becomes
# all a prospect needs to run `python -m foxy_testbed`. It adds NO dependency:
# the mock provider is stdlib-only and the two live providers import `requests`
# lazily, which is already the single entry above.
#
# ⚠ SHIPS FROM 1.9.0. Until this release the version here was 1.8.0, already
# tagged and published, so the wheel on PyPI did not contain this package and a
# re-upload of 1.8.0 would have been rejected. The 1.9.0 bump (S8) is what puts
# it there. Merging to main still publishes nothing — release.yml runs on a TAG
# — so nothing reaches PyPI until the tag is cut.
#
# The bump is FOUR strings, and the fourth is the one that gets forgotten: this
# file's `version`, foxy_audit/__init__.py's `__version__` AND its changelog
# block, and the repository-root VERSION file.
#
# The dependency arrow points one way only. foxy_testbed imports foxy_audit's
# PUBLIC api (FoxyClient.audit, check, the two block exceptions); nothing in
# foxy_audit imports anything from foxy_testbed, so the SDK is unchanged by its
# presence and removing the line below would leave foxy_audit intact.
packages = ["src/foxy_audit", "src/foxy_testbed"]
