# RETIRED
#
# Claims C2 removed. Each one pins a pattern that must never come back. This
# section is what proves the deletions were applied rather than merely decided:
# if the text is on a page again, the guard is red.
#
# ⚠ `must_not_match` is a REGEX over the page's rendered text OR its source,
# whichever the entry names. It is not a phrase to eyeball.
# ---------------------------------------------------------------------------
retired:

  - id: soc2-audit-underway
    claim: "We're currently completing our SOC 2 Type I audit."
    was_at: ["foxy-sale-page/faq.html:60", "foxy-sale-page/pricing.html:121"]
    verdict: delete
    regime: SOC 2
    replaced_with: "trust.html:151's wording — 'SOC 2 Type I is intended, but no auditor is engaged yet, so we are not putting a date on it.'"
    scope: text
    must_not_match:
      - "currently completing (?:our |the )?SOC ?2"
      - "SOC ?2[^.]{0,40}audit (?:is )?(?:underway|in progress|ongoing)"
      - "(?:undergoing|in the middle of|partway through)[^.]{0,30}SOC ?2"
      # ⚠ THE SPAN MAY NOT CONTAIN A NEGATION, and that is not a detail.
      # The first draft of this pattern matched trust.html's TRUE sentence,
      # "SOC 2 Type I — intended, but no auditor is engaged yet", and turned
      # the honest disclosure into a build failure. A pin that fires on the
      # correct text is worse than none: it teaches people to delete the pin.
      - 'SOC ?2(?:(?!\bno\b|\bnot\b)[^.]){0,60}\b(?:auditor|audit)\s+(?:has been\s+|is\s+)?engaged\b'
    why: >-
      ⚠ PINNED BECAUSE THIS IS A RECURRENCE, NOT A FIRST OFFENCE. The vault's
      'Owner-authorised divergences from the policy documents' already records
      that "the honest SOC 2 disclosure was softened or removed" once before.
      An edit fixes a page; a pin fixes the claim. The fourth pattern also
      catches the softer regression — quietly asserting an engaged auditor —
      which is the shape the next drift is most likely to take.
      trust.html:151 is deliberately NOT matched by any of these: it says an
      auditor is NOT engaged, and the negation is what makes it true.

  - id: hosting-country-united-states
    claim: "Infrastructure / hosting provider (Google Cloud, Ubuntu VM) — United States."
    was_at:
      - "foxy-sale-page/privacy.html:175 (§8 sub-processor list)"
      - "foxy-sale-page/privacy.html:208-209 (§13 international transfers)"
      - "foxy-sale-page/trust.html:144 (§6 sub-processor table)"
    verdict: delete
    regime: GDPR
    replaced_with: "Qatar (Google Cloud region me-central1, Doha), on all three sites."
    scope: source
    must_not_match:
      - "hosting provider \\(Google Cloud, Ubuntu VM\\)</strong> — United States"
      - "<td>Google Cloud \\(Ubuntu VM\\)</td><td>Hosting</td><td>United States</td>"
      - "data is processed in the <strong>United States</strong> \\(our hosting provider"
    why: >-
      A factually wrong residency statement, live on two legal pages, and
      load-bearing for GDPR Arts. 44-46: §13 then named the EU Standard
      Contractual Clauses for a United States destination the hosted data never
      reaches, so the transfer actually being made — EEA to Qatar, a country
      with no adequacy decision — was disclosed nowhere.
      ⚠ It is pinned as three exact strings AND enforced positively by
      assertions.hosting_country, because a pattern list can only catch the
      wording that already shipped. The positive assertion catches the next one.

  - id: passport-mapped-to-standards
    claim: "Mapped to standards: aligned to NIST AI RMF and the EU AI Act so reviewers recognize it on sight."
    was_at:
      - "foxy-sale-page/passport.html:7 (meta description)"
      - "foxy-sale-page/passport.html:32 (lead: 'mapped to the frameworks reviewers already use')"
      - "foxy-sale-page/passport.html:36 (feature bullet)"
      - "foxy-sale-page/docs.html:68 (passport card)"
    verdict: delete
    regime: NIST AI RMF
    replaced_with: "'Grouped by your policy tags' — which is what the Passport actually does."
    scope: text
    must_not_match:
      - "mapped to (?:the )?NIST"
      - "aligned to[^.]{0,30}NIST"
      - "NIST AI RMF"
      - "mapped to[^.]{0,40}(?:EU )?AI Act clauses?"
      - "mapped to the frameworks"
    why: >-
      backend/app/templates/compliance_passport.html contains ZERO occurrences
      of "NIST", "AI RMF", "AI Act" or any clause number — measured with grep -c
      on 2026-09-01 and again on this branch. The Passport is grouped by
      policy_tag. Nothing in it was mapped to a standard, so four surfaces
      claimed a feature the artefact did not have.
      ⚠ SCOPE NOTE, FOR THE REVIEWER. C0 staged this `delete` and the C2 brief
      did not enumerate it among the pages to correct. It was applied anyway,
      for one reason: the guard's rule is that a regime word with no backed or
      qualified entry fails the build, so leaving NIST on two pages with a
      `delete` verdict would have made the branch permanently red and the guard
      unshippable. Applying it was the only way to hand over a green branch.
      Reverting is a four-string change if the owner disagrees.
      C3 is the phase that could make the original claim true — the plan says
      the Passport should group by crosswalk row id rather than by policy_tag.
