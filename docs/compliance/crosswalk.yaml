  # ---------------------------------------------------------------- SOC 1 ---
  - id: SOC1-001
    regime: SOC1
    clause: "SSAE 18 AT-C 320 (SOC 1) scope"
    requirement: "A SOC 1 report addresses controls at a service organization that are likely to be relevant to user entities' internal control over financial reporting. Unlike SOC 2, it has no predefined criteria — the service organization writes its own control objectives and the auditor opines on whether they were met."
    control: null
    evidence: null
    status: not-applicable
    source: "Reasoning and codebase evidence established in the vault note 'Issues — SOC 1 is not applicable.md' (2026-08-23); scope distinction per AICPA SOC 1 vs SOC 2 positioning. Full reasoning in docs/compliance/not-applicable.md."
    notes: >-
      No money moves on a customer's behalf; the wire payload carries no amount,
      currency, account identifier or transaction reference; the policy
      vocabulary has no financial family; and the Passport explicitly disclaims
      the completeness over a population that a SOC 1 auditor would need. It
      becomes real only if a customer tells you their AI touches financial
      reporting — the trigger is theirs, not ours.
