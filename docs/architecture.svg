<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1242" width="1160" height="1242" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Foxy Audit architecture: content-blind audit evidence, end to end</title>
<desc id="dsc">Raw prompt and response text is hashed inside the customer process and never crosses the content-blindness boundary. Only bounded metadata reaches the FastAPI ingest, a per-org SHA-256 hash chain in PostgreSQL, and an outbox worker that grades that metadata with three AI judges. Qwen is the only tool-calling judge and can call flag_for_human_review instead of grading, which creates a row in the human_reviews queue for the dashboard reviewer page; resolving it appends a human_review_resolved audit event. Anyone can export the ledger and recompute the chain with the dependency-free verifier.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
<rect x="0" y="0" width="1160" height="1242" rx="0" fill="#F8FAFC" stroke="#748399" stroke-width="2"/>
<text x="36" y="44" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#1E293B" text-anchor="start">Foxy Audit — content-blind audit evidence, end to end</text>
<text x="36" y="68" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Raw text is committed locally and discarded. Only hashes and bounded metadata ever leave the customer process.</text>
