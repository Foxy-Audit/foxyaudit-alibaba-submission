# Dev / staging stack for app2 + admin2 + checkout2 - HACKATHON FREEZE ONLY.
#
# WHY THIS FILE EXISTS. The original repo is submitted to a hackathon and the
# production stack serving it must not change until results are announced. This
# runs a SECOND Foxy on the same VM so development can continue:
#
#   port      127.0.0.1:8086   (prod owns 8085)
#   database  foxy_dev, as the non-superuser role foxy_dev, inside the EXISTING
#             foxy-prod-db-1 container - reached over the prod compose network.
#   avatars   its own named volume; sharing prod's would write into it.
#
# GENERATED from docker-compose.prod.yml by a mechanical transform, NOT retyped.
# The environment block below is an ALLOWLIST - a value in deploy/.env that is
# not named here never reaches the container. When prod's list gains a variable,
# regenerate rather than hand-patching, or the two silently diverge.
#
# There is deliberately NO `db` service and NO `caddy` service.
#
# Run from deploy/:  docker compose -f docker-compose.dev2.yml up --build -d
#
# AT MERGE-BACK, DELETE: this file, the three app2/admin2/checkout2 nginx
# vhosts, their TLS cert, the foxy_dev database + roles, and the DNS records.

name: foxy-dev

services:
  foxy-migrate:
    build: ../backend
    environment:
      - DATABASE_URL=${DATABASE_URL:?set in deploy/.env}
    command: alembic upgrade head
    networks:
      - prodnet

  foxy-backend:
    build: ../backend
    depends_on:
      foxy-migrate:
        condition: service_completed_successfully
    environment:
      - FOXY_ENV=prod
      - DATABASE_URL=${DATABASE_URL:?set in deploy/.env}
      # Confined RLS role. Dev uses its OWN (foxy_app_dev), not prod's foxy_app:
      # the login role foxy_dev is a member of foxy_app_dev ONLY, so it cannot
      # connect to the production database and act as foxy_app there. This var is
      # NOT in the prod allowlist - without it here, setting it in .env would do
      # nothing at all, silently.
      - DB_APP_ROLE=${DB_APP_ROLE:-foxy_app}
      - SESSION_SECRET=${SESSION_SECRET:?set in deploy/.env}
      - STAFF_SESSION_SECRET=${STAFF_SESSION_SECRET:?set in deploy/.env}
      - API_KEY_PEPPER=${API_KEY_PEPPER:?set in deploy/.env}
      # Fernet KEK that wraps tenant BYOK provider keys at rest. Optional at the
      # compose level so a missing value degrades ONLY BYOK key storage (HTTP 503)
      # instead of taking the service down; the app validates it loudly at startup.
      - PROVIDER_KEY_ENCRYPTION_KEY=${PROVIDER_KEY_ENCRYPTION_KEY:-}
      - STAFF_COOKIE_DOMAIN=${STAFF_COOKIE_DOMAIN:-admin.foxyaudit.tech}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://foxyaudit.tech,https://www.foxyaudit.tech}
      - ADMIN_CORS_ORIGINS=${ADMIN_CORS_ORIGINS:-}
      - ADMIN_IP_ALLOWLIST=${ADMIN_IP_ALLOWLIST:-}
      - TRAFFIC_TRACKING_ENABLED=${TRAFFIC_TRACKING_ENABLED:-true}
      - TRAFFIC_RETENTION_DAYS=${TRAFFIC_RETENTION_DAYS:-90}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-12}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-plus}
      - QWEN_TIMEOUT=${QWEN_TIMEOUT:-12}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_COMPANION=${STRIPE_PRICE_COMPANION:-}
      - STRIPE_PRICE_GUARDIAN=${STRIPE_PRICE_GUARDIAN:-}
      - STRIPE_PRICE_MAX=${STRIPE_PRICE_MAX:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}
      # Paddle (M2). This block is an ALLOWLIST: a value in deploy/.env that is
      # not named here never reaches the container. PADDLE_* was added to
      # config.py and to nothing else, so a correctly-filled .env produced an
      # upgrade page with no plans and a checkout that could not be created.
      - PADDLE_API_KEY=${PADDLE_API_KEY:-}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET:-}
      - PADDLE_ENV=${PADDLE_ENV:-sandbox}
      - PADDLE_PRICE_PRO=${PADDLE_PRICE_PRO:-}
      - PADDLE_PRICE_MAX=${PADDLE_PRICE_MAX:-}
      - PADDLE_SIGNATURE_TOLERANCE_SECONDS=${PADDLE_SIGNATURE_TOLERANCE_SECONDS:-300}
      - TRIAL_DAYS=${TRIAL_DAYS:-7}
      # M4a. Default FALSE: turning it on makes every new signup wait for a
      # human, so it is the deliberate act of saying the approvals queue exists.
      - DEMO_APPROVAL_REQUIRED=${DEMO_APPROVAL_REQUIRED:-false}
      - MONTHLY_QUOTA_FREE=${MONTHLY_QUOTA_FREE:-500}
      - MONTHLY_QUOTA_PRO=${MONTHLY_QUOTA_PRO:-25000}
      - MONTHLY_QUOTA_MAX=${MONTHLY_QUOTA_MAX:-250000}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-no-reply@foxyaudit.tech}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Foxy Audit}
      - DASHBOARD_URL=${DASHBOARD_URL:-https://app.foxyaudit.tech/dashboard}
      - ADMIN_URL=${ADMIN_URL:-https://admin.foxyaudit.tech/admin/}
      - FOXY_DASHBOARD_HTML=/site/foxy-dashboard/foxy-audit-premium.html
      - FOXY_ADMIN_HTML=/site/foxy-adminpage/index.html
      # Anchor SLA cadences (6E) — the API reports them via /v1/anchors/sla; keep
      # in sync with the worker service below (which enforces them).
      - ANCHOR_CADENCE_FREE=${ANCHOR_CADENCE_FREE:-86400}
      - ANCHOR_CADENCE_PRO=${ANCHOR_CADENCE_PRO:-21600}
      - ANCHOR_CADENCE_MAX=${ANCHOR_CADENCE_MAX:-3600}
      - ANCHOR_CADENCE_ENTERPRISE=${ANCHOR_CADENCE_ENTERPRISE:-3600}
      - ANCHOR_CADENCE_DEFAULT=${ANCHOR_CADENCE_DEFAULT:-86400}
      # EVM anchoring for manual "anchor now" (POST /v1/anchors runs in THIS API
      # process). The automatic sweep lives in foxy-worker, which also has these —
      # both read the same values from deploy/.env.
      - ANCHOR_ENABLED=${ANCHOR_ENABLED:-false}
      - ANCHOR_PROVIDER=${ANCHOR_PROVIDER:-stub}
      - ANCHOR_EVM_RPC_URL=${ANCHOR_EVM_RPC_URL:-}
      - ANCHOR_EVM_CHAIN=${ANCHOR_EVM_CHAIN:-sepolia}
      - ANCHOR_EVM_PRIVATE_KEY=${ANCHOR_EVM_PRIVATE_KEY:-}
      - ANCHOR_EVM_CONTRACT=${ANCHOR_EVM_CONTRACT:-}
      - ANCHOR_WALLET_MIN_BALANCE_WEI=${ANCHOR_WALLET_MIN_BALANCE_WEI:-0}
    volumes:
      # Dashboard + ops-console HTML live at the repo root, outside the build
      # context. Mount the DIRECTORIES (not single files): git reset on deploy
      # replaces files with new inodes, and a single-file bind mount would keep
      # serving the stale pre-deploy copy until the container is recreated.
      - ../foxy-dashboard:/site/foxy-dashboard:ro
      - ../foxy-adminpage:/site/foxy-adminpage:ro
      # P6c · avatar PNGs. READ-WRITE, unlike the two site mounts above: this is
      # the only path in this product the app WRITES to, and it is the first prod
      # state that does not live in Postgres. A named volume, not a bind mount, so
      # it survives `docker compose down` and a git reset on deploy.
      - foxy_dev_avatars:/data/avatars
    # Loopback-only publish: the host reverse proxy (nginx on the shared VM, or
    # the optional caddy service) reaches the API here; never expose publicly.
    ports:
      - "127.0.0.1:8086:8000"
    # --proxy-headers: real client IP/scheme from the proxy's X-Forwarded-* —
    # needed for rate-limit keys, traffic ip_hash, and the admin IP allow-list.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Grading poller + anchoring + usage_daily rollups + traffic partition upkeep.
    networks:
      - prodnet

  foxy-worker:
    build: ../backend
    depends_on:
      foxy-migrate:
        condition: service_completed_successfully
    environment:
      - FOXY_ENV=prod
      - DATABASE_URL=${DATABASE_URL:?set in deploy/.env}
      # Confined RLS role. Dev uses its OWN (foxy_app_dev), not prod's foxy_app:
      # the login role foxy_dev is a member of foxy_app_dev ONLY, so it cannot
      # connect to the production database and act as foxy_app there. This var is
      # NOT in the prod allowlist - without it here, setting it in .env would do
      # nothing at all, silently.
      - DB_APP_ROLE=${DB_APP_ROLE:-foxy_app}
      - SESSION_SECRET=${SESSION_SECRET:?}
      - STAFF_SESSION_SECRET=${STAFF_SESSION_SECRET:?}
      - API_KEY_PEPPER=${API_KEY_PEPPER:?}
      # KEK for BYOK provider keys — the worker DECRYPTS them at grading time, so
      # this is the most important service for it to reach. Optional here (degrades
      # BYOK grading to evaluator_unavailable) but validated loudly at startup.
      - PROVIDER_KEY_ENCRYPTION_KEY=${PROVIDER_KEY_ENCRYPTION_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-12}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-plus}
      - QWEN_TIMEOUT=${QWEN_TIMEOUT:-12}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-no-reply@foxyaudit.tech}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Foxy Audit}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - ADMIN_ACTIONS_RETENTION_DAYS=${ADMIN_ACTIONS_RETENTION_DAYS:-365}
      - GRADING_BREAKER_THRESHOLD=${GRADING_BREAKER_THRESHOLD:-3}
      - GRADING_BREAKER_COOLDOWN=${GRADING_BREAKER_COOLDOWN:-60}
      - GRADING_MAX_BACKOFF=${GRADING_MAX_BACKOFF:-60}
      - USAGE_ROLLUP_INTERVAL=${USAGE_ROLLUP_INTERVAL:-300}
      - TRAFFIC_RETENTION_DAYS=${TRAFFIC_RETENTION_DAYS:-90}
      - ANCHOR_ENABLED=${ANCHOR_ENABLED:-false}
      - ANCHOR_PROVIDER=${ANCHOR_PROVIDER:-stub}
      - ANCHOR_INTERVAL_SECONDS=${ANCHOR_INTERVAL_SECONDS:-3600}
      - ANCHOR_CADENCE_FREE=${ANCHOR_CADENCE_FREE:-86400}
      - ANCHOR_CADENCE_PRO=${ANCHOR_CADENCE_PRO:-21600}
      - ANCHOR_CADENCE_MAX=${ANCHOR_CADENCE_MAX:-3600}
      - ANCHOR_CADENCE_ENTERPRISE=${ANCHOR_CADENCE_ENTERPRISE:-3600}
      - ANCHOR_CADENCE_DEFAULT=${ANCHOR_CADENCE_DEFAULT:-86400}
      - ANCHOR_EVM_RPC_URL=${ANCHOR_EVM_RPC_URL:-}
      - ANCHOR_EVM_CHAIN=${ANCHOR_EVM_CHAIN:-sepolia}
      - ANCHOR_EVM_PRIVATE_KEY=${ANCHOR_EVM_PRIVATE_KEY:-}
      - ANCHOR_EVM_CONTRACT=${ANCHOR_EVM_CONTRACT:-}
      - ANCHOR_WALLET_MIN_BALANCE_WEI=${ANCHOR_WALLET_MIN_BALANCE_WEI:-0}
      - ANCHOR_STALE_ALERT_SECONDS=${ANCHOR_STALE_ALERT_SECONDS:-0}
      - ANCHOR_ALERT_COOLDOWN=${ANCHOR_ALERT_COOLDOWN:-3600}
    volumes:
      # The worker does not write avatars today. It is mounted anyway because the
      # account-deletion path it owns will need to unlink them, and a worker that
      # could not see the directory would fail that silently — leaving a deleted
      # user's photo on disk, which is the kind of orphan a compliance product
      # should not create.
      - foxy_dev_avatars:/data/avatars
    command: python -m app.worker_main
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,psycopg,datetime as d,sys; u=os.environ['DATABASE_URL'].replace('+psycopg',''); c=psycopg.connect(u); r=c.execute('SELECT beat_at FROM worker_heartbeat WHERE id=1').fetchone(); c.close(); sys.exit(0 if r and r[0] and (d.datetime.now(d.timezone.utc)-r[0]).total_seconds()<30 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    restart: unless-stopped

  # OPTIONAL edge proxy for a DEDICATED VM (owns 80/443, auto-TLS). NOT started
  # by default: the shared foxyaudit.tech VM already runs nginx on 80/443, which
  # proxies to the backend's loopback port instead (see deploy/nginx-foxyaudit.conf).
  # Enable on a dedicated box with:  docker compose --profile edge up -d
    networks:
      - prodnet

networks:
  # The production project's default network, joined as an external. This is
  # what makes the hostname `db` resolve to foxy-prod-db-1. Nothing in the prod
  # project is modified or restarted by attaching to it.
  prodnet:
    external: true
    name: foxy-prod_default

volumes:
  # NOT prod's foxy_avatars. A shared volume would let the dev stack write
  # into the frozen submission's uploaded files.
  foxy_dev_avatars:
