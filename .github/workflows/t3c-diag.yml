name: T3C diagnostic (throwaway)

# ⚠ TEMPORARY — register #242. Deleted before this branch merges.
# Round 3 measures the FIX against the BASELINE on the same runner, three runs
# each, because the crash is a race: `main` is 5/5 dead on the desktop-compile
# job, but a second pytest process on an already-warm runner has come back
# green. Only same-job repetition can tell a fix from a lucky run.
on:
  push:
    branches: [fix/desktop-ci-abort]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install desktop deps
        run: pip install -r desktop/requirements.txt pytest

      - name: BASELINE x3 - conftest.py removed, exactly as ci.yml runs it
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mv desktop/conftest.py /tmp/conftest.py
          mv desktop/test_no_egress.py /tmp/test_no_egress.py
          for i in 1 2 3; do
            python -m pytest desktop -q > /tmp/base$i.txt 2>&1; echo "BASELINE run $i exit=$?"
            tail -n 4 /tmp/base$i.txt
          done
          mv /tmp/conftest.py desktop/conftest.py
          mv /tmp/test_no_egress.py desktop/test_no_egress.py

      - name: FIX x3 - conftest.py in place
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for i in 1 2 3; do
            python -m pytest desktop -q > /tmp/fix$i.txt 2>&1; echo "FIX run $i exit=$?"
            tail -n 4 /tmp/fix$i.txt
          done
