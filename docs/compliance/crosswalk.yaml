    regime: GDPR
    clause: "Art. 46"
    requirement: "Transfers subject to appropriate safeguards — in the absence of an adequacy decision, a controller or processor may transfer personal data to a third country only if it has provided appropriate safeguards, and on condition that enforceable data subject rights and effective legal remedies are available."
    control: "foxy-sale-page/dpa.html §on transfers commits to the EU SCCs where a destination is not adequate."
    evidence: null
    status: gap
    source: "GDPR Art. 46, gdpr-info.eu — https://gdpr-info.eu/art-46-gdpr/ (article titles verified 2026-09-01 via https://gdpr-info.eu/)"
    notes: >-
      ⚠ STATUS UNCHANGED AT `gap` 2026-09-02 by C2-HARDEN. `evidence` CHANGED
      "The published DPA." -> null. THIS IS THE ONE ROW OF [[#306]]'s SIX WHERE
      THE STATUS WAS RIGHT AND THE EVIDENCE FIELD WAS WRONG, AND IT MARKS THE
      BOUNDARY OF THE [[#305]] RULE.

      THE BOUNDARY, STATED SO THE NEXT READER DOES NOT HAVE TO REDERIVE IT: the
      [[#305]] rule — a published commitment is a control with inspectable
      evidence, so a row citing one is `partial` — holds WHEN THE COMMITMENT IS
      THE THING THE CLAUSE ASKS FOR. Art. 33(2) asks a processor to notify
      without undue delay; a published promise to notify without undue delay IS a
      partial discharge of it, and is enforceable against Foxy. Art. 46 does not
      ask anyone to promise a safeguard. It says a transfer may be made only
      where the exporter "has PROVIDED appropriate safeguards" — an executed
      instrument, in place before the transfer. A promise to execute SCCs is not
      a weak version of executed SCCs; it is a different kind of object, and the
      clause names the object. So the control FAILS the clause, which is
      README.md's second definition of `gap`.

      It follows that the published DPA is not evidence FOR THIS ROW. It is
      genuine evidence that Foxy made a commitment — and it is cited as such on
      the rows whose clauses ask for a commitment — but this row's clause is
      discharged by an executed safeguard and by nothing else, and no third party
      can inspect one, because none exists. Hence null. ⚠ THE TEST OF THE RULE IS
      THE OBJECT THE CLAUSE NAMES, NOT WHETHER A DOCUMENT IS PUBLISHED.

      The underlying facts, unchanged: the DPA names the mechanism generically;
      the privacy policy names SCCs only for a US destination that is not where
      the data is. No executed SCCs and no transfer impact assessment exist for
      the EEA -> Qatar leg. C1 deliverable 3. ⚠ [[#293]] makes it sharper than
      "not yet executed" — the SCC sentence is affirmatively false for OpenAI,
      with which nothing was ever executed. ⚠ [[#296]]: dpa.html, the page this
      row's control cites, still asserts SCC reliance and C2b could not touch it.

