      - "(?:are|is) covered by (?:the )?(?:EU )?Standard Contractual Clauses"
      - "Standard Contractual Clauses (?:are|is) in place"
    why: >-
      ⚠ VAULT #293, CONFIRMED BY THE OWNER 2026-09-01, NOT HYPOTHETICAL. The C2
      executor raised this about text it had not written and left it untouched
