name: T3C diagnostic (throwaway)

# ⚠ TEMPORARY — register #242. Deleted before this branch merges.
# Round 2. Round 1 established: the wheel is load-bearing (suite green with it
# uninstalled), the crash is a background ApiWorker QThread, and the reported
# "crashing test" is only whoever was inside processEvents() at the time.
# What round 1 could NOT show is the TRACEBACK: stdout is block-buffered into a
# pipe while stderr is not, so the two interleave and only the last line
# survived. Every step below redirects BOTH into one file and cats it.
on:
  push:
    branches: [fix/desktop-ci-abort]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install desktop deps
        run: pip install -r desktop/requirements.txt pytest

      - name: E - test_d16_testbed.py ALONE (wheel present)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest desktop/test_d16_testbed.py -q > /tmp/e.txt 2>&1; echo "exit=$?"
          cat /tmp/e.txt

      - name: F - the PAIR, default capture, one stream
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest desktop/test_d16_testbed.py desktop/test_d5_pages.py -q > /tmp/f.txt 2>&1; echo "exit=$?"
          cat /tmp/f.txt

      - name: G - the PAIR again (is it deterministic?)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest desktop/test_d16_testbed.py desktop/test_d5_pages.py -q > /tmp/g.txt 2>&1; echo "exit=$?"
          cat /tmp/g.txt

      - name: H - the FULL suite, exactly as ci.yml runs it
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest desktop -q > /tmp/h.txt 2>&1; echo "exit=$?"
          tail -n 80 /tmp/h.txt

      - name: I - the PAIR with the WHEEL UNINSTALLED
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip uninstall -y foxy-audit
          python -m pytest desktop/test_d16_testbed.py desktop/test_d5_pages.py -q > /tmp/i.txt 2>&1; echo "exit=$?"
          cat /tmp/i.txt
