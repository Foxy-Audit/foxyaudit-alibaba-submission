  hard_facts:
    # Established before this file was written; do not re-derive them here.
    hosting: "GCP me-central1-a — Doha, Qatar. No EU adequacy decision for Qatar."
    backups: >-
      deploy/backup.sh writes every pg_dump to deploy/backups ON THE PRODUCTION
      VM, RETENTION_DAYS default 14. ⚠ CORRECTED 2026-09-02: those are not the
      only copy. GCP resource policy `default-schedule-1` takes DAILY SNAPSHOTS
      of the production disk, retained 14 days with
      `onSourceDiskDelete: KEEP_AUTO_SNAPSHOTS`, and they are stored in the `eu`
      MULTI-REGION — measured 5 of 5 sampled, 2026-09-01. So an off-VM,
      off-region copy exists and survives deletion of the source disk. It is
      crash-consistent (`guestFlush: false`), not application-consistent, and NO
      RESTORE OF EITHER HAS EVER BEEN PERFORMED.
    kek_colocation: >-
      ⚠ ADDED 2026-09-02 by C1-SYNC, from [[#302]]. ENCRYPTION AT REST IS NOT A
      TWO-FACTOR CONTROL IN THIS DEPLOYMENT. deploy/docker-compose.prod.yml
      sources PROVIDER_KEY_ENCRYPTION_KEY from deploy/.env on the production VM,
      and the same compose stack runs the Postgres holding the *_key_enc
      ciphertext on that same host — so whoever can read the database can read
      the key that decrypts it, and a host compromise is full BYOK plaintext
      exposure from minute one. It defends against a stolen disk or a leaked
      dump, which is real and is not nothing; it does not defend against the
      host. This is the ordinary posture of a single-VM deployment and is not
      negligence — it is recorded because several rows below cite "KEK-encrypted
      provider keys" as a security measure and a reader is entitled to know what
      it is a measure against. CLAUDE.md §6 names the KEK a crown jewel for the
      AVAILABILITY risk (lose it and every stored key is unrecoverable); this is
      the CONFIDENTIALITY one and it was unrecorded until now.
    chain_head_witness: >-
      ⚠ ADDED 2026-09-02 by C1-SYNC, from [[#304]]. NOTHING IS ESTABLISHED TO
      PRODUCE AN OFF-HOST RECORD OF THE CHAIN HEADS. incident-response.md §7's
      recovery step wants a chain-head record kept somewhere other than the
      machine being recovered, so that "was the ledger altered during the
      incident?" is answerable from something the incident did not touch. The
      EVM/Sepolia anchoring path may already be most of the answer and several
      rows cite it — but it is OPTIONAL, and whether it is enabled in production
      has not been established here. Do not read those rows as asserting that it
      is. The GCP EU snapshots are off-host and off-region but crash-consistent
      and never restored, so they are a recovery hope and not an integrity
      witness.
    baa: "No BAA exists anywhere in the repo, the sale page or the vault (searched 2026-09-01)."
    platform_keys: "backend/app/judge_routing.py platform_keys_allowed() lets Foxy's OWN provider keys carry customer event metadata to OpenAI and Google."
    policy_tags: "sdk/src/foxy_audit/policy.py KNOWN_POLICY_TAGS = {default, soc2, hipaa, gdpr} + aliases {hipaa_basic, gdpr_basic}. _POLICY_EXTRA maps soc2 -> () — baseline only."
    judge_limit: "The AI judge sees only hashes and counts. It CANNOT assess maliciousness. No row here may imply otherwise."
    company: "Foxy is incorporated in Pakistan. Two people. No legal budget yet."

# ---------------------------------------------------------------------------
# REGIMES
#
# posture:
#   CLAIMED      a customer-facing surface names this regime today
#   MAPPED-ONLY  mapped here for planning; no customer-facing surface names it
#
# Posture is about what we SAY, not about what we have. Every regime below is
# one Foxy the company is certified in exactly none of.
# ---------------------------------------------------------------------------
regimes:
  - id: HIPAA
    name: "Health Insurance Portability and Accountability Act — Security Rule, Breach Notification Rule (45 CFR Part 164)"
    posture: CLAIMED
    role: >-
      If a customer sends PHI through the SDK, Foxy is a business associate.
      No BAA exists, so that relationship is currently un-papered.
    named_on: ["foxy-sale-page/install.html", "foxy-sale-page/how-it-works.html", "foxy-sale-page/welcome.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: SOC2
    name: "AICPA Trust Services Criteria (2017, with revised points of focus 2022)"
    posture: CLAIMED
    role: >-
      An organisational control regime. It is NOT a per-call policy and can
      never be one — see the `soc2` vocabulary rows below.
    named_on: ["foxy-sale-page/faq.html", "foxy-sale-page/pricing.html", "foxy-sale-page/trust.html", "foxy-sale-page/privacy.html", "foxy-sale-page/how-it-works.html", "foxy-sale-page/install.html", "foxy-sale-page/sdk.html"]

  - id: GDPR
    name: "Regulation (EU) 2016/679"
    posture: CLAIMED
    role: "Foxy is a processor for customer workspace data; a controller for account data."
    named_on: ["foxy-sale-page/privacy.html", "foxy-sale-page/dpa.html", "foxy-sale-page/cookie-policy.html", "foxy-sale-page/index.html", "foxy-sale-page/install.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: EU_AI_ACT
    name: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    posture: CLAIMED
    role: >-
      Foxy is not a provider or deployer of a high-risk AI system. It is a
      record-keeping tool a deployer can use toward Art. 26(6). Provider
      obligations are not-applicable to Foxy itself.
    named_on: ["foxy-sale-page/passport.html", "foxy-sale-page/docs.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: NIST_AI_RMF
    name: "NIST AI Risk Management Framework 1.0"
    posture: CLAIMED
    role: >-
      NOT one of the eight regimes C0 was scoped to map. It is here because two
      customer-facing pages claim the Compliance Passport is mapped to it and
      the Passport template contains zero NIST references. See surface_claims.
    named_on: ["foxy-sale-page/passport.html", "foxy-sale-page/docs.html"]

  - id: PDPL_KSA
    name: "Saudi Personal Data Protection Law (Royal Decree M/19, as amended)"
    posture: MAPPED-ONLY
    role: "Live Gulf customers exist. The published privacy policy does not cover PDPL."
    named_on: []

  - id: PDPL_UAE
    name: "UAE Federal Decree-Law No. 45 of 2021 on the Protection of Personal Data"
    posture: MAPPED-ONLY
    role: "Live Gulf customers exist. The published privacy policy does not cover PDPL."
    named_on: []

  - id: QATAR_13_2016
    name: "Qatar Law No. 13 of 2016 Concerning Personal Data Privacy Protection (PDPPL)"
    posture: MAPPED-ONLY
    role: >-
      Reaches Foxy through HOSTING, not through customers: production runs in
      GCP me-central1-a, Doha. Whether hosting alone triggers obligations is a
      legal question and is TBD.
    named_on: []

  - id: PCI_DSS
    name: "PCI DSS v4.0.1"
    posture: CLAIMED
    role: >-
      Foxy is not a merchant, not a service provider in a cardholder data
      environment, and stores no account data. The claim surface is a single
      dashboard string naming a `pci` tag the SDK does not recognise.
    named_on: ["foxy-dashboard/foxy-audit-premium.html"]

  - id: ISO_27001
    name: "ISO/IEC 27001:2022"
    posture: CLAIMED
    role: "Named only in the negative and as a roadmap item. Not certified."
    named_on: ["foxy-sale-page/trust.html", "foxy-sale-page/privacy.html"]

  - id: LGPD
    name: "Brazil — Lei Geral de Proteção de Dados Pessoais, Lei nº 13.709/2018"
    posture: CLAIMED
    role: >-
      Foxy is an "operador" (processor) for customer workspace data and a
      "controlador" for account data — the same split as GDPR. Named on
      privacy.html §14 since long before this crosswalk existed.
    named_on: ["foxy-sale-page/privacy.html"]

  - id: PIPEDA
    name: "Canada — Personal Information Protection and Electronic Documents Act (S.C. 2000, c. 5)"
    posture: CLAIMED
    role: >-
      PIPEDA does not use the controller/processor split. It makes an
      organisation accountable for personal information "in its possession or
      custody, including information that has been transferred to a third party
      for processing" (Sch. 1, cl. 4.1.3) — which is exactly the platform-key
      leg that content-blindness does not cover.
    named_on: ["foxy-sale-page/privacy.html"]

  - id: PDPA_SG
    name: "Singapore — Personal Data Protection Act 2012 (2020 Rev. Ed.)"
    posture: CLAIMED
    role: >-
      Foxy is a "data intermediary" — it processes personal data on behalf of
      and for the purposes of another organisation. That status carries a duty
      of its own under s. 26C(3)(a), and it is the sharpest PDPA row here.
    named_on: ["foxy-sale-page/privacy.html"]

  - id: AU_PRIVACY
    name: "Australia — Privacy Act 1988 (Cth), Schedule 1 (Australian Privacy Principles) and Part IIIC (Notifiable Data Breaches)"
    posture: CLAIMED
    role: >-
      Whether Foxy is an "APP entity" at all turns on the small-business
      exemption and the Australian-link test. That is a legal question and is
      TBD; the rows below map the obligations that bind if it is one.
    named_on: ["foxy-sale-page/privacy.html"]

  - id: SOC1
    name: "SSAE 18 SOC 1 (ICFR)"
    posture: MAPPED-ONLY
    role: "NOT APPLICABLE. Reasoning lives in docs/compliance/not-applicable.md."
    named_on: []

# ---------------------------------------------------------------------------
# SURFACE CLAIMS
#
# Every regime word found on a customer-facing surface, and where it lands.
# Found with:
#   grep -ril "HIPAA\|SOC 2\|GDPR\|PCI\|ISO 27001\|FedRAMP\|CCPA\|NIST" \
#        foxy-sale-page/ foxy-dashboard/
# then re-run per word with word boundaries, because base64 image payloads in
# these files contain the letter sequences "pci", "PDPL" and "NIST" and a naive
# grep reports them as claims.
#
# verdict:
#   backed      a crosswalk row supports the claim as written
#   qualify     true but overclaims as written; C2 should narrow it
#   delete      not true, or not supportable; C2 should remove it
# ---------------------------------------------------------------------------
surface_claims:
  - claim: "We're currently completing our SOC 2 Type I audit."
    where: >-
      REMOVED FROM THIS REPO by C2 (2d03a2e). Last present at e7e1919:
      foxy-sale-page/faq.html:60 and foxy-sale-page/pricing.html:121. Both now
      carry trust.html's wording ("No. We do not currently hold SOC 2..."); the
      removed sentence is pinned in claims.yaml `retired` so it cannot come back.
      ⚠ STILL LIVE on foxyaudit.tech, which serves the frozen repo, so the
      verdict below is about a claim a reader can still find today.
    pins: null
    retired_as: [soc2-audit-underway]
    verdict: delete
    why: >-
      foxy-sale-page/trust.html:151 says the opposite on the same site: "SOC 2
      Type I — intended, but no auditor is engaged yet, so we are not putting a
      date on it." Two pages cannot both be true. "Completing an audit" with no
      engaged auditor is not a qualification, it is a false statement of fact.
    regime: SOC2

  - claim: "Infrastructure / hosting provider (Google Cloud, Ubuntu VM) — United States."
    where: >-
      foxy-sale-page/privacy.html:175 and foxy-sale-page/trust.html:144 — ⚠ THE
      LINE NUMBERS DID NOT MOVE AND THE TEXT ON THEM DID. C2 (2d03a2e) rewrote
      both lines in place: privacy.html:175 now reads "Qatar (Google Cloud region
      me-central1, Doha)" and trust.html:144's cell now reads "Qatar
      (me-central1, Doha)". This is the entry that shows why a line number is not
      an identifier — claims.yaml locates its claims by `anchor` for exactly this
      reason. ⚠ STILL LIVE on foxyaudit.tech; the verdict stands.
    pins:
      # ⚠ THIS IS THE ENTRY [[#307]] WAS FILED ABOUT. The two lines below did not
      # move and their text changed under them, so a line-number refresh saw
      # nothing. The pins are the REPLACEMENT text: rewriting either back to a
      # country that is not Qatar now fails the guard instead of passing it.
      - at: "foxy-sale-page/privacy.html:175"
        text: "hosting provider (Google Cloud, Ubuntu VM) — Qatar"
      - at: "foxy-sale-page/trust.html:144"
        text: "Hosting Qatar (me-central1, Doha)"
    retired_as: [hosting-country-united-states]
    verdict: delete
    why: >-
      ⚠ FOUND BY THIS PHASE, NOT ANTICIPATED BY THE PLAN. Production runs in GCP
      me-central1-a — Doha, Qatar. The published privacy policy and the trust
      page both state the hosting region as the United States. This is a
      factually wrong residency statement on a legal page, live today, and it
      is load-bearing for GDPR Art. 44-46: the transfer actually being made is
      EEA -> Qatar, a country with no adequacy decision, and neither page
      mentions it.
    regime: GDPR

  - claim: "Your data is processed in the United States (our hosting infrastructure, Google, OpenAI, and Paddle) and the European Union (Brevo). ... Where personal data is transferred from the EEA, UK, or Switzerland to the United States, we rely on the EU Standard Contractual Clauses..."
