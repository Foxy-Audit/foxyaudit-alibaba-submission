  --bg:#0e0c0a; --surf:#1c1815; --surf2:#221d18; --line:#322b23;
  --ink:#f7f1e8; --muted:#8c8174; --fox:#ff7a2e; --foxdeep:#8a3611;
  --safe:#3ddc84; --paper:#f0ede6; --papertxt:#21252e;
  --clay:9px 9px 0 rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.04) inset;
  --clay-sm:5px 5px 0 rgba(0,0,0,.5);
  --disp:'Poppins',system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --code:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.75,.15,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#070604;}
#frame{position:fixed;inset:0;display:grid;place-items:center;}
#stage{position:relative;width:1920px;height:1080px;background:var(--bg);overflow:hidden;
  font-family:var(--sans);color:var(--ink);}
#stage::before{content:'';position:absolute;inset:0;
  background:radial-gradient(1300px 850px at 50% 42%, rgba(255,122,46,.06), transparent 62%),
             radial-gradient(1600px 1100px at 50% 120%, rgba(138,54,17,.10), transparent 60%);
  pointer-events:none;}
#stage.paused *{animation-play-state:paused!important;}
#stage.seek *{transition:none!important;}

/* fox watermark - continuity with the intro slide */
#foxmark{position:absolute;left:64px;top:44px;width:76px;animation:bob 3.4s ease-in-out infinite;
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45));}
@keyframes bob{50%{transform:translateY(-4px);}}

/* ============================== the judge card (Gemini <-> BYOK swap) */
.jcard{position:absolute;left:790px;top:300px;width:340px;height:340px;border-radius:20px;
  background:var(--surf);border:1px solid var(--line);box-shadow:var(--clay);
  overflow:hidden;z-index:5;
  opacity:0;transform:translateX(160px);
  transition:opacity .4s var(--ease),transform .5s cubic-bezier(.22,1.12,.3,1);}
#stage.t-in .jcard{opacity:1;transform:none;}
.jface{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:18px;
  transition:transform .42s cubic-bezier(.3,.8,.2,1);}
.jface img{width:150px;height:150px;object-fit:contain;}
.jface .nm{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);}
.jface .sub{font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-top:-8px;}
.jf2{transform:translateY(100%);}
#stage.t-swap .jf1{transform:translateY(-100%);}
#stage.t-swap .jf2{transform:translateY(0);}
#stage.t-swapback .jf1{transform:translateY(0);}
#stage.t-swapback .jf2{transform:translateY(100%);}
/* BYOK face: the swap glyph */
.jf2 .cyc{width:120px;height:120px;}
.jf2 .cyc svg{width:120px;height:120px;stroke:var(--fox);fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;}
#stage.t-swap .jf2 .cyc svg{animation:spin 1.6s var(--ease);}
@keyframes spin{to{transform:rotate(360deg);}}
/* corner swap cue, always on the card */
.jcue{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:9px;
  background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center;}
.jcue svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;}

/* ============================== message pills streaming through the card */
.stream{position:absolute;left:0;top:434px;width:1920px;height:80px;pointer-events:none;z-index:4;}
.pill{position:absolute;left:120px;top:18px;width:120px;height:44px;border-radius:22px;
  background:var(--surf2);border:1px solid var(--line);opacity:0;
  display:flex;align-items:center;justify-content:center;gap:8px;}
.pill i{width:46px;height:9px;border-radius:5px;background:var(--muted);opacity:.5;}
.pill svg{width:20px;height:20px;stroke:var(--safe);stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;}
#stage.t-stream .pill{animation:flow 4.2s linear infinite;}
#stage.t-stream .pill svg{animation:mark 4.2s linear infinite;}
#stage.t-stream .pill:nth-child(2),#stage.t-stream .pill:nth-child(2) svg{animation-delay:1.4s;}
#stage.t-stream .pill:nth-child(3),#stage.t-stream .pill:nth-child(3) svg{animation-delay:2.8s;}
@keyframes flow{0%{transform:translateX(0);opacity:0;}7%{opacity:1;}
  38%{transform:translateX(560px);opacity:1;}46%{transform:translateX(700px);opacity:0;}
  54%{transform:translateX(860px);opacity:0;}60%{transform:translateX(940px);opacity:1;}
  88%{transform:translateX(1180px);opacity:1;}96%,100%{transform:translateX(1260px);opacity:0;}}
@keyframes mark{0%,58%{opacity:0;}64%,90%{opacity:1;}97%,100%{opacity:0;}}

/* ============================== Google Cloud platform bar */
.gbar{position:absolute;left:560px;top:700px;width:800px;height:96px;border-radius:18px;
  background:var(--surf2);border:1px solid var(--line);box-shadow:var(--clay-sm);
  display:flex;align-items:center;justify-content:center;gap:18px;z-index:3;
  opacity:0;transform:translateY(70px);
  transition:opacity .45s var(--ease),transform .5s cubic-bezier(.22,1.12,.3,1);}
#stage.t-cloud .gbar{opacity:1;transform:none;}
.gbar img{width:56px;height:56px;object-fit:contain;}
.gbar .nm{font-family:var(--sans);font-weight:700;font-size:21px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink);}
/* the judge card settles onto the platform */
#stage.t-cloud .jcard{transform:translateY(-10px);}
/* legs connecting card to platform */
.gleg{position:absolute;width:4px;height:60px;background:var(--line);left:880px;top:640px;z-index:2;
  transform:scaleY(0);transform-origin:top;transition:transform .4s .25s var(--ease);}
.gleg.b{left:1036px;}
#stage.t-cloud .gleg{transform:scaleY(1);}

/* ============================== result chip -> Etherscan card */
.rchip{position:absolute;left:1010px;top:440px;z-index:6;
  font-family:var(--code);font-size:22px;color:var(--fox);background:var(--bg);
  border:2px solid var(--fox);border-radius:12px;padding:12px 18px;box-shadow:var(--clay-sm);
  opacity:0;white-space:nowrap;
  transition:opacity .35s var(--ease),transform .8s cubic-bezier(.3,.7,.15,1);}
#stage.t-chain .rchip{opacity:1;transform:translate(330px,-16px);}
#stage.t-lock .rchip{opacity:0;transform:translate(400px,-10px) scale(.55);transition:opacity .3s,transform .45s var(--ease);}
.rchip small{display:block;font-family:var(--sans);font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.echain{position:absolute;left:1400px;top:308px;width:330px;border-radius:20px;
  background:var(--paper);border:1px solid var(--line);box-shadow:var(--clay);z-index:5;
  padding:30px 0 24px;text-align:center;
  opacity:0;transform:translateX(140px);
  transition:opacity .4s var(--ease),transform .5s cubic-bezier(.22,1.12,.3,1);}
#stage.t-chain .echain{opacity:1;transform:none;}
.echain img{width:150px;height:94px;object-fit:contain;}
.echain .nm{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--papertxt);margin-top:12px;}
.echain .sub{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:#5a6070;margin-top:4px;}
/* lock badge stamps on the card corner */
.ebadge{position:absolute;left:-26px;top:-26px;width:64px;height:64px;border-radius:50%;
  background:var(--fox);display:grid;place-items:center;box-shadow:var(--clay-sm);
  opacity:0;transform:scale(.4);
  transition:opacity .25s .0s var(--ease),transform .3s cubic-bezier(.3,1.18,.45,1);}
#stage.t-lock .ebadge{opacity:1;transform:scale(1);}
.ebadge svg{width:30px;height:30px;stroke:#2a1400;fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;}
.ering{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;
  border:2px solid var(--fox);border-radius:50%;opacity:0;transform:scale(.5);pointer-events:none;}
#stage.t-lock .ering{animation:lockring 1s .25s var(--ease) 2;}
@keyframes lockring{0%{transform:scale(.5);opacity:.45;}100%{transform:scale(1.35);opacity:0;}}

/* ============================== captions - one line, replaced per beat */
.caps{position:absolute;left:0;right:0;top:900px;text-align:center;font-family:var(--disp);}
.cap{position:absolute;left:0;right:0;top:0;font-weight:700;font-size:46px;letter-spacing:-.01em;
  opacity:0;transform:translateY(24px);
  transition:opacity .45s var(--ease),transform .45s var(--ease);}
.cap b{color:var(--fox);}
#stage.t-cap1 .cap1,#stage.t-cap2 .cap2,#stage.t-cap3 .cap3,#stage.t-cap4 .cap4{opacity:1;transform:none;}
#stage.t-cap2 .cap1,#stage.t-cap3 .cap2,#stage.t-cap4 .cap3{opacity:0;transform:translateY(-18px);}

@media (prefers-reduced-motion:reduce){
  #stage *{animation:none!important;transition-duration:.2s!important;}
}
</style>
</head>

<script>
'use strict';
/* [seconds, className] - retime freely */
var STEPS = [
  [ 0.30,'t-in'],        // Gemini card slams in
  [ 0.90,'t-stream'],    // messages stream through it
  [ 1.10,'t-cap1'],
  [ 6.20,'t-swap'],      // slot-spin to the BYOK face
  [ 6.40,'t-cap2'],
  [ 9.20,'t-swapback'],  // and back - it's a slot, not a fixture
  [11.00,'t-cloud'],     // platform bar slides under
  [11.20,'t-cap3'],
  [16.00,'t-chain'],     // Etherscan card in, result chip flies
  [16.20,'t-cap4'],
  [17.10,'t-lock'],      // lock badge stamps, rings pulse
  [23.00,'t-end']
];
var TOTAL = STEPS[STEPS.length-1][0];

var stage = document.getElementById('stage');
var applied = 0, t0 = null, elapsed = 0, paused = false, raf = 0;

function apply(t){
  while(applied < STEPS.length && STEPS[applied][0] <= t){
    stage.classList.add(STEPS[applied][1]); applied++;
  }
}
function tick(now){
  if(t0 === null) t0 = now;
  elapsed = (now - t0)/1000;
  apply(elapsed);
  raf = requestAnimationFrame(tick);
}
function play(){ paused = false; stage.classList.remove('paused');
  raf = requestAnimationFrame(function(now){ t0 = now - elapsed*1000;
    raf = requestAnimationFrame(function(n2){ stage.classList.remove('seek'); tick(n2); });
  }); }
function pause(){ paused = true; stage.classList.add('paused'); cancelAnimationFrame(raf); }
function seek(t, stay){
  cancelAnimationFrame(raf);
  STEPS.forEach(function(s){ stage.classList.remove(s[1]); });
  stage.classList.add('seek');
  applied = 0; elapsed = Math.max(0, t);
  apply(elapsed);
  if(stay){ paused = true; } else { play(); }
}
function sceneStarts(){ return [0, 6.2, 11.0, 16.0]; }
function jump(dir){
  var s = sceneStarts(), i;
  if(dir > 0){ for(i=0;i<s.length;i++){ if(s[i] > elapsed+0.05){ seek(s[i], paused); return; } } seek(TOTAL, true); }
  else { for(i=s.length-1;i>=0;i--){ if(s[i] < elapsed-0.6){ seek(s[i], paused); return; } } seek(0, paused); }
}
function fit(){ stage.style.transform = 'scale(' + Math.min(innerWidth/1920, innerHeight/1080) + ')'; }
stage.style.transformOrigin = 'center';
addEventListener('resize', fit); fit();
addEventListener('keydown', function(e){
  if(e.key === ' '){ e.preventDefault(); paused ? play() : pause(); }
  else if(e.key === 'r' || e.key === 'R'){ seek(0, false); }
  else if(e.key === 'ArrowRight'){ jump(1); }
  else if(e.key === 'ArrowLeft'){ jump(-1); }
});
var q = new URLSearchParams(location.search).get('t');
if(q !== null && !isNaN(parseFloat(q))){ seek(parseFloat(q), true); }
else { play(); }
</script>
</body>
</html>
