# Foxy Audit — regime crosswalk
#
# Phase C0 of docs/plans/compliance-program.md. READ docs/compliance/README.md
# BEFORE READING OR EDITING THIS FILE — it defines what each status word means
# and what may be written into `evidence`. The definitions are narrower than
# they look.
#
# ⚠ THE ONE RULE: never write a clause number you have not verified against a
# real source. `clause: TBD` with `status: gap` is a correct answer. An invented
# article number is a defect, and this file will be read as authoritative.

meta:
  phase: C0
  written: "2026-09-01"
  verified_against: "01e87ad"        # origin/main at the time of writing
  written_by: "executor chat, per docs/plans/compliance-program.md §4 C0"
  legal_review: "NONE — this file is engineering research, not legal advice"
  scope: >-
    Maps regulatory clauses onto Foxy controls and onto evidence a third party
    could inspect. It is a planning artefact. It is not a compliance claim, it
    is not a certification, and no row in it has been reviewed by a lawyer.
  hard_facts:
    # Established before this file was written; do not re-derive them here.
    hosting: "GCP me-central1-a — Doha, Qatar. No EU adequacy decision for Qatar."
    backups: "deploy/backup.sh writes to deploy/backups ON THE PRODUCTION VM, RETENTION_DAYS default 14."
    baa: "No BAA exists anywhere in the repo, the sale page or the vault (searched 2026-09-01)."
    platform_keys: "backend/app/judge_routing.py platform_keys_allowed() lets Foxy's OWN provider keys carry customer event metadata to OpenAI and Google."
    policy_tags: "sdk/src/foxy_audit/policy.py KNOWN_POLICY_TAGS = {default, soc2, hipaa, gdpr} + aliases {hipaa_basic, gdpr_basic}. _POLICY_EXTRA maps soc2 -> () — baseline only."
    judge_limit: "The AI judge sees only hashes and counts. It CANNOT assess maliciousness. No row here may imply otherwise."
    company: "Foxy is incorporated in Pakistan. Two people. No legal budget yet."

# ---------------------------------------------------------------------------
# REGIMES
#
# posture:
#   CLAIMED      a customer-facing surface names this regime today
#   MAPPED-ONLY  mapped here for planning; no customer-facing surface names it
#
# Posture is about what we SAY, not about what we have. Every regime below is
# one Foxy the company is certified in exactly none of.
# ---------------------------------------------------------------------------
regimes:
  - id: HIPAA
    name: "Health Insurance Portability and Accountability Act — Security Rule, Breach Notification Rule (45 CFR Part 164)"
    posture: CLAIMED
    role: >-
      If a customer sends PHI through the SDK, Foxy is a business associate.
      No BAA exists, so that relationship is currently un-papered.
    named_on: ["foxy-sale-page/install.html", "foxy-sale-page/how-it-works.html", "foxy-sale-page/welcome.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: SOC2
    name: "AICPA Trust Services Criteria (2017, with revised points of focus 2022)"
    posture: CLAIMED
    role: >-
      An organisational control regime. It is NOT a per-call policy and can
      never be one — see the `soc2` vocabulary rows below.
    named_on: ["foxy-sale-page/faq.html", "foxy-sale-page/pricing.html", "foxy-sale-page/trust.html", "foxy-sale-page/privacy.html", "foxy-sale-page/how-it-works.html", "foxy-sale-page/install.html", "foxy-sale-page/sdk.html"]

  - id: GDPR
    name: "Regulation (EU) 2016/679"
    posture: CLAIMED
    role: "Foxy is a processor for customer workspace data; a controller for account data."
    named_on: ["foxy-sale-page/privacy.html", "foxy-sale-page/dpa.html", "foxy-sale-page/cookie-policy.html", "foxy-sale-page/index.html", "foxy-sale-page/install.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: EU_AI_ACT
    name: "Regulation (EU) 2024/1689 (Artificial Intelligence Act)"
    posture: CLAIMED
    role: >-
      Foxy is not a provider or deployer of a high-risk AI system. It is a
      record-keeping tool a deployer can use toward Art. 26(6). Provider
      obligations are not-applicable to Foxy itself.
    named_on: ["foxy-sale-page/passport.html", "foxy-sale-page/docs.html", "foxy-dashboard/foxy-audit-premium.html"]

  - id: NIST_AI_RMF
    name: "NIST AI Risk Management Framework 1.0"
    posture: CLAIMED
    role: >-
      NOT one of the eight regimes C0 was scoped to map. It is here because two
      customer-facing pages claim the Compliance Passport is mapped to it and
      the Passport template contains zero NIST references. See surface_claims.
    named_on: ["foxy-sale-page/passport.html", "foxy-sale-page/docs.html"]

  - id: PDPL_KSA
    name: "Saudi Personal Data Protection Law (Royal Decree M/19, as amended)"
    posture: MAPPED-ONLY
    role: "Live Gulf customers exist. The published privacy policy does not cover PDPL."
    named_on: []

  - id: PDPL_UAE
    name: "UAE Federal Decree-Law No. 45 of 2021 on the Protection of Personal Data"
    posture: MAPPED-ONLY
    role: "Live Gulf customers exist. The published privacy policy does not cover PDPL."
    named_on: []

  - id: QATAR_13_2016
    name: "Qatar Law No. 13 of 2016 Concerning Personal Data Privacy Protection (PDPPL)"
    posture: MAPPED-ONLY
    role: >-
      Reaches Foxy through HOSTING, not through customers: production runs in
      GCP me-central1-a, Doha. Whether hosting alone triggers obligations is a
      legal question and is TBD.
    named_on: []

  - id: PCI_DSS
    name: "PCI DSS v4.0.1"
    posture: CLAIMED
    role: >-
      Foxy is not a merchant, not a service provider in a cardholder data
      environment, and stores no account data. The claim surface is a single
      dashboard string naming a `pci` tag the SDK does not recognise.
    named_on: ["foxy-dashboard/foxy-audit-premium.html"]

  - id: ISO_27001
    name: "ISO/IEC 27001:2022"
    posture: CLAIMED
    role: "Named only in the negative and as a roadmap item. Not certified."
    named_on: ["foxy-sale-page/trust.html", "foxy-sale-page/privacy.html"]

  - id: SOC1
    name: "SSAE 18 SOC 1 (ICFR)"
    posture: MAPPED-ONLY
    role: "NOT APPLICABLE. Reasoning lives in docs/compliance/not-applicable.md."
    named_on: []

# ---------------------------------------------------------------------------
# SURFACE CLAIMS
#
# Every regime word found on a customer-facing surface, and where it lands.
# Found with:
#   grep -ril "HIPAA\|SOC 2\|GDPR\|PCI\|ISO 27001\|FedRAMP\|CCPA\|NIST" \
#        foxy-sale-page/ foxy-dashboard/
# then re-run per word with word boundaries, because base64 image payloads in
# these files contain the letter sequences "pci", "PDPL" and "NIST" and a naive
# grep reports them as claims.
#
# verdict:
#   backed      a crosswalk row supports the claim as written
#   qualify     true but overclaims as written; C2 should narrow it
#   delete      not true, or not supportable; C2 should remove it
# ---------------------------------------------------------------------------
surface_claims:
  - claim: "We're currently completing our SOC 2 Type I audit."
    where: "foxy-sale-page/faq.html:60 and foxy-sale-page/pricing.html:121"
    verdict: delete
    why: >-
      foxy-sale-page/trust.html:151 says the opposite on the same site: "SOC 2
      Type I — intended, but no auditor is engaged yet, so we are not putting a
      date on it." Two pages cannot both be true. "Completing an audit" with no
      engaged auditor is not a qualification, it is a false statement of fact.
    regime: SOC2

  - claim: "Infrastructure / hosting provider (Google Cloud, Ubuntu VM) — United States."
    where: "foxy-sale-page/privacy.html:175, and the same row in foxy-sale-page/trust.html:144"
    verdict: delete
    why: >-
      ⚠ FOUND BY THIS PHASE, NOT ANTICIPATED BY THE PLAN. Production runs in GCP
      me-central1-a — Doha, Qatar. The published privacy policy and the trust
      page both state the hosting region as the United States. This is a
      factually wrong residency statement on a legal page, live today, and it
      is load-bearing for GDPR Art. 44-46: the transfer actually being made is
      EEA -> Qatar, a country with no adequacy decision, and neither page
      mentions it.
    regime: GDPR

  - claim: "Your data is processed in the United States (our hosting infrastructure, Google, OpenAI, and Paddle) and the European Union (Brevo). ... Where personal data is transferred from the EEA, UK, or Switzerland to the United States, we rely on the EU Standard Contractual Clauses..."
    where: "foxy-sale-page/privacy.html:208-209 (§13 International Data Transfers)"
    verdict: delete
    why: >-
      Same defect, one section further on, and worse: it names a transfer
      mechanism for a destination that is not the actual destination. The Art.
      46 safeguard for the EEA -> Qatar leg is not stated because the leg is not
      disclosed. C1 owns the fix (SCCs + a transfer impact assessment); C2 owns
      the page.
    regime: GDPR

  - claim: "Mapped to standards: aligned to NIST AI RMF and the EU AI Act so reviewers recognize it on sight."
    where: "foxy-sale-page/passport.html:36, and passport.html:7 / docs.html:68 in the same words"
    verdict: delete
    why: >-
      backend/app/templates/compliance_passport.html contains zero occurrences
      of "NIST", "AI RMF", "AI Act" or any clause number (grep -c, 2026-09-01).
      The Passport is grouped by policy_tag. Nothing in it is mapped to a
      standard. C3 is the phase that could make this claim true; until it does,
      the claim has nothing behind it.
    regime: NIST_AI_RMF

  - claim: "Any interaction tagged pci, sox, hipaa, gdpr or eu_ai_act is risk-scored 60 or higher unless it is clearly compliant."
    where: "foxy-dashboard/foxy-audit-premium.html:2360 (Regulated data mode — HIPAA / financial)"
    verdict: qualify
    why: >-
      Three of the five tags named — `pci`, `sox`, `eu_ai_act` — are not in the
      SDK's KNOWN_POLICY_TAGS. A customer may pass them as free strings (the SDK
      warns once per unknown tag), so the sentence is not false; but a
      dashboard listing them beside `hipaa` and `gdpr` reads as four regime
      modes where two exist. This is the only surface where the word "pci"
      appears at all.
    regime: PCI_DSS

  - claim: "@foxy.audit(policy=\"soc2\")"
    where: "foxy-sale-page/how-it-works.html:38, foxy-sale-page/sdk.html:38, foxy-sale-page/install.html:58"
    verdict: qualify
    why: >-
      _POLICY_EXTRA maps "soc2": () — baseline injection and secret checks only,
      no SOC 2-specific rule. The code is right and the vocabulary is wrong: SOC
      2 is an organisational control regime and cannot be a per-call check. The
      example is not a false claim, but the tag name implies a check that does
      not and cannot exist. C2 owns the vocabulary fix.
    regime: SOC2

  - claim: "@foxy.audit(policy=\"hipaa\")"
    where: "foxy-sale-page/install.html:54, foxy-sale-page/welcome.html:88 (as hipaa_basic)"
    verdict: backed
    why: >-
      `hipaa` -> ("phi",) is a real detection family and mode=\"block\" genuinely
      stops the model call before it is made. What it does NOT establish is that
      Foxy may lawfully receive PHI — that needs a BAA, which does not exist.
      Backed as a product claim; see the HIPAA gap rows for the company claim.
    regime: HIPAA

  - claim: "Its verdict is a review signal — not a HIPAA or SOC 2 certification — and unavailable judge results remain visibly unknown."
    where: "foxy-sale-page/how-it-works.html:56"
    verdict: backed
    why: "A disclaimer, and an accurate one. This is the sentence other pages should sound like."
    regime: SOC2

  - claim: "We do not currently hold SOC 2, ISO 27001, or a comparable third-party attestation."
    where: "foxy-sale-page/trust.html:150 and foxy-sale-page/privacy.html:177"
    verdict: backed
    why: "True, and stated plainly. Nothing to change."
    regime: ISO_27001

  - claim: "Roadmap: ISO 27001 gap analysis — Q2 2027. SOC 2 Type I — intended, but no auditor is engaged yet, so we are not putting a date on it."
    where: "foxy-sale-page/trust.html:151"
    verdict: backed
    why: "True. It is also the sentence that makes faq.html:60 and pricing.html:121 indefensible."
    regime: SOC2

  - claim: "EU / EEA / UK (GDPR): analytics is off until you opt in ... California (CCPA/CPRA): we don't sell or share personal information"
    where: "foxy-sale-page/cookie-policy.html:116-117, foxy-sale-page/index.html:1389-1460, and foxy-sale-page/dpa.html:99 (which defines the controller/processor split in CCPA/CPRA terms as well as GDPR terms)"
    verdict: backed
    why: >-
      A geo-aware consent gate that is actually implemented in index.html. The
      claim is about cookies, not about certification.
    regime: GDPR

  - claim: "Rights lists for Brazil (LGPD), Canada (PIPEDA), Singapore, Australia"
    where: "foxy-sale-page/privacy.html:221-224"
    verdict: qualify
    why: >-
      ⚠ OUT OF C0 SCOPE AND RECORDED SO NOBODY MISTAKES THIS FILE FOR COMPLETE.
      LGPD, PIPEDA, Singapore PDPA and Australian Privacy Principles are named
      on a live legal page and have NO rows in this crosswalk. Either they get
      regimes here or the privacy policy stops naming them. The same page omits
      PDPL, which live Gulf customers are behind.
    regime: null

  - claim: "FedRAMP"
    where: null
    verdict: backed
    why: "Zero occurrences on any customer-facing surface. Nothing to resolve."
    regime: null

# ---------------------------------------------------------------------------
# ROWS
#
# status: met | partial | gap | not-applicable
#   met            the requirement is discharged AND a third party can inspect
#                  the evidence that says so. THERE ARE ZERO `met` ROWS. That is
#                  not modesty; see README.md "Why nothing is met".
#   partial        a real control exists and does real work, but either it does
#                  not discharge the clause on its own or no third party can
#                  inspect it.
#   gap            no control, or a control that fails the clause.
#   not-applicable the clause cannot bind Foxy. Every one carries its reasoning.
#
# control:  what Foxy does. May name closed-source code.
# evidence: what an OUTSIDE party could obtain and inspect. A path into the
#           private backend is NOT evidence — it is a control. null is common
#           and is the honest answer.
# ---------------------------------------------------------------------------
rows:

