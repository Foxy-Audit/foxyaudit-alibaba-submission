# Foxy Audit — the compliance claims register
#
# Phase C2 of docs/plans/compliance-program.md. READ docs/compliance/README.md
# for what a crosswalk row id means before trusting a `backing` here.
#
# WHAT THIS FILE IS FOR, AND WHY IT IS NOT A LIST OF STRINGS TO GREP
#
# foxy-sale-page/test_site_wide_claims.py already proves the three sub-processor
# lists AGREE with each other. On 2026-09-01 they agreed, and all three were
# wrong: every one of them stated the hosting country as the United States while
# production ran in GCP me-central1, Doha, Qatar. A consistency guard over false
# content reads green, because it cannot be wrong about its own subject.
#
# So this file records what is TRUE, not what is consistent:
#
#   assertions:  single-valued facts every surface must agree WITH. The guard
#                compares the pages to the value here, not to each other.
#   claims:      every regime word on every customer-facing surface, one entry
#                per (file, line, regime), each with a verdict and a crosswalk
#                row that backs it.
#   retired:     claims C2 removed, each pinning a pattern that must never come
#                back. The SOC 2 sentence is here because the vault records it
#                being softened once before — this is a recurrence, so it is
#                pinned rather than merely edited.
#
# The guard is foxy-sale-page/test_compliance_claims.py. It fails the build.

meta:
  phase: "C2 + C2-HARDEN"
  c2_harden: >-
    C2-HARDEN (2026-09-02) added the two claim classes [[#295]] measured MISSING
    — `baa_contractual` and `security_specifics` — and gave every class the
    option of `must_match_examples`, sentences the pattern MUST still select. The
    two sentences #295 got through are fixtures there now rather than memories,
    so neither class can be loosened back to the state that missed them.
    ⚠ `verified_against` NOT re-stamped: foxy-sale-page/ and foxy-dashboard/ are
    byte-identical between 4466996 and 81510ac (measured, `git diff --stat`), so
    every line number in this file is as true at one as at the other.
  written: "2026-09-01"
  verified_against: "4466996"       # re-stamped by C1-SYNC, 2026-09-02
  branch: "feat/compliance-c2"
  written_by: "executor chat, per docs/plans/compliance-program.md §4 C2"
  c1_sync: >-
    ⚠ C1-SYNC re-stamped `verified_against` on 2026-09-02 and changed nothing
    else in this file. It could re-stamp with confidence because unlike the
    crosswalk's `surface_claims`, EVERY `line` here is asserted by a test:
    foxy-sale-page/test_compliance_claims.py
    ::test_the_recorded_line_numbers_are_current locates each claim by its
    `anchor` and fails the build if the recorded line is not where the anchor
    is. The suite was green at 4466996, so the numbers below are current by
    proof rather than by assertion.

    That test is also the reason crosswalk.yaml's `meta.line_number_semantics`
    decided the way it did: line numbers in these files track THIS repository,
    at the SHA in `verified_against`, because that is the only claim a script
    can check. See that block for the full reasoning and for how the four
    `delete` verdicts stay correct about a live site this repo no longer
    matches.
  legal_review: "NONE — no wording in this file or on the pages it governs has been reviewed by a lawyer"
  surfaces: ["foxy-sale-page/", "foxy-dashboard/"]
  not_a_surface: >-
    foxy-adminpage/ is a staff operations console, not a customer-facing
    surface, and is deliberately out of scope. If it ever becomes
    customer-visible it has to be added to meta.surfaces and re-scanned.
  freeze: >-
    ⚠ Nothing on this branch reaches the real repo before 2026-09-18. That is
    the owner's decision, recorded in docs/plans/compliance-program.md §9.3 and
    in the vault. The corrections below are FINISHED and waiting, so that date
    is a merge and not a project. Do not re-open it.

# ---------------------------------------------------------------------------
# ASSERTIONS
#
# Single-valued facts. The guard checks the PAGES against these values. There
# is exactly one right answer per key and it is written here, so a page that
# agrees with the other pages and disagrees with reality still fails.
# ---------------------------------------------------------------------------
assertions:

  hosting_country:
    value: "Qatar"
    detail: "Google Cloud region me-central1, Doha, Qatar"
    established: "owner, from the GCP console, 2026-09-01; recorded in the vault at 'Compliance — operating facts'"
    must_appear_on:
      - "foxy-sale-page/privacy.html"      # §8 sub-processor list, §13 transfers
      - "foxy-sale-page/trust.html"        # §6 sub-processor table
    #: Countries that MAY appear beside a provider on those pages, because a
    #: real sub-processor is there. Any other country next to a hosting word is
    #: the old defect coming back.
    other_provider_countries:
      ["United States", "European Union", "France", "Global (UK-headquartered)"]
    #: ⚠ EXEMPTIONS ARE EXACT SENTENCES, NOT A WILDCARD.
    #: A sentence that says where data is NOT hosted is not a statement of the
    #: hosting country, and the guard cannot tell the two apart from the words
    #: alone. So each one is pinned here in full: change a comma in it and the
    #: exemption stops applying and the guard fires again. That is the property
    #: an "ignore sentences containing not" rule would not have — under that
    #: rule, "our servers are not in the United States, they are in Ireland"
    #: would sail through.
    sentence_exemptions:
      - sentence: "We do not process personal data in Pakistan — our operating company is incorporated there ( Section 1 ), but no customer data is currently hosted or processed on Pakistani servers."
        why: >-
          §13. A NEGATIVE hosting statement — it says no customer data is
          hosted in Pakistan, which is true and is there because the operating
          company is incorporated there. It names a place beside a hosting word
          without asserting that place as the hosting country.
    #: The exact defect that was live until this branch. Never again, on any page.
    must_not_match:
      - 'hosting provider \(Google Cloud, Ubuntu VM\)</strong> — United States'
      - '<td>Google Cloud \(Ubuntu VM\)</td><td>Hosting</td><td>United States</td>'
      - 'data is processed in the <strong>United States</strong> \(our hosting provider'

  soc2_status:
    value: "no auditor engaged"
    detail: >-
      Foxy holds no SOC 2 report of any type and no auditor is engaged. SOC 2
      Type I is intended with no date attached. trust.html is the canonical
      wording and the other pages defer to it.
    established: "foxy-sale-page/trust.html §7, unchanged since before this phase; confirmed against the repo and the vault 2026-09-01"
    canonical_page: "foxy-sale-page/trust.html"

    #: ⚠ #292 — WHY THIS CLASS EXISTS AT ALL.
    #: C2 guarded SOC 2 by banning phrases that had already been wrong. MAIN
    #: broke it with one line the guard had never seen:
    #:   "Our SOC 2 Type I report is expected shortly and fieldwork is already
    #:    underway."
    #: — as false as the sentence that was removed, and all nine tests stayed
    #: green. A blacklist pins the sentence that WAS wrong; the expected failure
    #: mode here is a human REWRITING it, and a human rewriting it will not
    #: reuse a banned phrase.
    #: `sentence_pattern` + `approved_sentences` invert that: every sentence on
    #: the subject must be one written down here. Novel text fails by default.
    sentence_pattern: '\bSOC ?2\b'
    #: ⚠ CASE-SENSITIVE. Under re.I this also matches the `soc2` POLICY TAG in
    #: the code samples on how-it-works.html, sdk.html and install.html. Those
    #: are a different claim — recorded `qualified` under `claims` — and pulling
    #: them in here would force code samples into a prose approval list.
    case_sensitive: true

    #: Phrases that must appear on `canonical_page` AND on every page in
    #: `must_carry_canonical`. This is what makes trust.html the single source:
    #: change it there and the failure names trust.html first.
    canonical_phrases:
      - "We do not currently hold SOC 2, ISO 27001, or a comparable third-party attestation."
      - "no auditor is engaged yet"
    must_carry_canonical:
      - "foxy-sale-page/faq.html"
      - "foxy-sale-page/pricing.html"

    #: Every sentence naming SOC 2 on any customer-facing surface. Extracted
    #: from the pages, not typed. Adding one is the moment somebody has to
    #: decide whether it is true.
    approved_sentences:
      - "Is this SOC 2 certified?"
      - "We do not currently hold SOC 2, ISO 27001, or a comparable third-party attestation."
      - "SOC 2 Type I is intended, but no auditor is engaged yet, so we are not putting a date on it."
      - "Its verdict is a review signal — not a HIPAA or SOC 2 certification — and unavailable judge results remain visibly unknown."
      - "SOC 2 Type I is intended, but no auditor is engaged yet, so we are not putting a date on it — the current status is always on our Trust & Security page."
      - "We do not currently hold a SOC 2, ISO 27001, or comparable third-party attestation."
      - "Certifications status today We do not currently hold SOC 2, ISO 27001, or a comparable third-party attestation."
      - "SOC 2 Type I — intended, but no auditor is engaged yet, so we are not putting a date on it."

  backup_locations:
    value: "two locations, and only one is Qatar"
    detail: >-
      Nightly pg_dump and avatar archives -> deploy/backups ON THE PRODUCTION VM,
      in Qatar, RETENTION_DAYS default 14. GCP disk snapshots of the `devops`
      disk -> daily, 14 kept, storageLocations ['eu'] — the EU MULTI-REGION.
      guestFlush is false, so the snapshots are crash-consistent, not
      application-consistent.
    established: >-
      Measured against GCP by MAIN 2026-09-01 and systematic, not a one-off:
      5 of 5 sampled `devops` / me-central1-a snapshots return ['eu']. The
      schedule `default-schedule-1` pins no storageLocations, so GCP applied its
      default and chose the nearest multi-region. ⚠ The console showing
      me-central1 and gcloud showing eu is NOT a contradiction — a snapshot is a
      separate storage object and its location is independent of the disk's zone.
      Vault issue #291.
    must_appear_on:
      - "foxy-sale-page/privacy.html"
    must_mention: ["Qatar", "European Union"]
    sentence_pattern: '\bbackups?\b|\bsnapshots?\b|\bdumps?\b'
    #: ⚠ `dumps?` is in the pattern so the sentence that puts the DUMPS in Qatar
    #: joins the class. Without it, deleting that sentence would leave the page
    #: saying only that a copy is in the EU, and `must_mention` would still pass
    #: because "Qatar" appears elsewhere on the page a dozen times.
    approved_sentences:
      - "Backups are kept in two places, and only one of them is in Qatar."
      - "Nightly database dumps and avatar archives are written to the server itself, in Qatar, and kept for 14 days."
      - "Separately, Google Cloud takes a daily snapshot of the server's disk and stores it in the European Union multi-region, also kept for 14 days, so a complete copy of the data we host in Qatar is held in the EU as well."
      - "Those snapshots are taken while the machine is running, so they capture the disk as it stood at that moment rather than a cleanly closed database, which is why we keep the nightly dumps as well."
      - "International Data Transfers In short: Your workspace data is hosted in Qatar, and daily snapshots of that server's disk are stored in the European Union."
      - "Daily snapshots of our server's disk are also stored in the European Union multi-region (see Section 8 ), so a complete copy of the hosted data is held there as well as in Qatar."

  data_location_exclusivity:
    value: "no surface may claim data is only in one place"
    detail: >-
      Two false residency sentences have shipped from this section. #289 said
      hosting was in the United States when it is in Qatar. #294 said backups
      "do not leave Qatar" when the GCP snapshots are in the EU multi-region.
      BOTH TOOK THE SAME GRAMMATICAL SHAPE — a place plus a totality word — and
      that shape is what this class guards.
    established: "vault #289 (2026-09-01) and #294 (2026-09-01), both measured, not inferred"
    scope_to: ['foxy-sale-page/privacy.html']
    #: ⚠ SCOPED TO privacy.html ON PURPOSE. trust.html's sub-processor table has
    #: no sentence boundaries, so flattening it produces one enormous pseudo-
    #: sentence that would land in this list unreadably. That table's Location
    #: column is already guarded structurally by `hosting_country` — mutations
    #: A2 and A8 prove it — so nothing is left uncovered.
    sentence_pattern: '(?:Qatar|Doha|me-central1|European Union|\bEU\b|EEA|United States|Pakistan|Ireland|Germany|Singapore)[^.]{0,60}\b(?:only|solely|exclusively|at all times|entirely|never leaves?|never leave|do(?:es)? not leave|remains? within|stays? within|remains? in|stays? in|and nowhere else)\b|\b(?:only|solely|exclusively|at all times|entirely|never leaves?|never leave|do(?:es)? not leave|remains? within|stays? within|remains? in|stays? in|and nowhere else)\b[^.]{0,40}(?:Qatar|Doha|me-central1|European Union|\bEU\b|EEA|United States|Pakistan|Ireland|Germany|Singapore)|\b(?:all|every|any|no|none of the) (?:copies|copy|data|backups?|snapshots?)\b[^.]{0,60}(?:Qatar|Doha|me-central1|European Union|\bEU\b|EEA|United States|Pakistan|Ireland|Germany|Singapore)'
    approved_sentences:
      - "Backups are kept in two places, and only one of them is in Qatar."
      - "Pakistan: while the Personal Data Protection Bill remains in draft form (see Section 1 ), we extend the same rights described above to individuals in Pakistan as a matter of policy, not only where currently legally mandated."

  transfer_safeguards:
    value: "no safeguard may be asserted that has not been evidenced"
    detail: >-
      As at 2026-09-01, confirmed by the owner: OpenAI — NO DPA or SCCs ever
      executed, a key is set and that is all. Google Cloud — probably covered by
      auto-incorporated terms, artefact never produced. Paddle — sandbox.
      Payoneer — nothing. Qatar — no Article 46 instrument exists.
    established: "vault #293, answered by the owner 2026-09-01"
    scope_to: ['foxy-sale-page/privacy.html']
    #: ⚠ SCOPED TO privacy.html, AND THE REASON MATTERS. dpa.html, msa.html and
    #: terms.html are CONTRACT instruments and are full of this language by
    #: design — a contract says what the parties will rely on, which is a
    #: forward obligation, not a statement of present fact. privacy.html §13 is
    #: the page that states present fact, so it is the page this class guards.
    #: ⚠ See open_questions.dpa_asserts_scc_reliance: dpa.html says "the parties
    #: rely on the EU Standard Contractual Clauses", which is the same assertion
    #: this branch just removed from §13. C2b did NOT rewrite it — changing
    #: contract text needs a lawyer — but it must not be forgotten.
    sentence_pattern: 'Standard Contractual Clauses|\bSCCs?\b|\bClauses\b|data processing agreement|Article 46|adequacy decision|International Data Transfer Addendum'
    approved_sentences:
      - "Qatar has no EU adequacy decision, and for the United States we cannot yet evidence a safeguard for every sub-processor — both are set out below."
      - "The safeguard Article 46 GDPR requires for a transfer from the EEA, UK, or Switzerland to the United States is the EU Standard Contractual Clauses , together with the UK International Data Transfer Addendum for UK transfers and Swiss Federal Act on Data Protection safeguards for Swiss transfers."
      - "— no data processing agreement has been executed, so no Standard Contractual Clauses cover this transfer."
      - "Google's standard cloud terms incorporate the Clauses and we expect them to apply, but we have not obtained the executed instrument and have not confirmed which of these services those terms cover."
      - "Qatar is not the subject of a European Commission adequacy decision."
      - "A transfer of personal data from the EEA, UK, or Switzerland to our hosting region in Qatar is therefore a transfer to a third country without adequacy, and it requires a safeguard under Article 46 GDPR."
      - "If you are an EEA, UK, or Swiss customer and need a named Article 46 safeguard for either destination before sending personal data, write to privacy@foxyaudit.tech and we will tell you exactly where we are."

  # ── the two classes #295 measured MISSING, added 2026-09-02 by C2-HARDEN ──
  #
  # ⚠ WHY THESE TWO AND WHY NOW. #295 attacked the class rule with four
  # sentences it had never seen. Two were caught, including the two hardest.
  # The two that got through were not caught because the guard was weak — they
  # got through because THE CLASSES DID NOT EXIST, and a guard cannot assert
  # about a class nobody registered. So "the guard is green" means "no false
  # claims OF A REGISTERED CLASS", and the only fix for that is to register the
  # class before the sentence is written. Both sentences below are preserved as
  # `must_match_examples`, which is what stops either class rotting into a
  # pattern that matches nothing.

  baa_contractual:
    value: "no surface may claim a BAA exists, with anyone, until one does"
    detail: >-
      ⚠ THERE IS NO BUSINESS ASSOCIATE AGREEMENT ANYWHERE — vault #288, searched
      across the repo, the sale page and the vault 2026-09-01. No BAA, no BAA
      offering, no process. Healthcare customers are live and sending PHI, so
      the sentence "we sign BAAs" is the single most valuable false claim
      somebody could add to this site, and it is one form away from feeling
      true.

      ⚠ AND THE TRAP THAT MAKES THIS CLASS URGENT RATHER THAN TIDY: task C3 of
      the owner action checklist will produce a BAA WITH GOOGLE, because Google
      Cloud signs one for free. A BAA with Google is not a BAA with customers.
      It covers Foxy's use of Google's HIPAA-eligible services; it gives a
      customer nothing and makes Foxy nobody's business associate. The moment it
      is executed, "we have a BAA" becomes tempting AND half-true, which is the
      worst kind. THIS CLASS EXISTS BEFORE THE TEMPTATION, so the sentence has
      to be written down and its counterparty named before it can ship.

      There are zero matching sentences on any surface today, and
      `approved_sentences` is EMPTY ON PURPOSE. That is not a class guarding
      nothing: it is a class saying no sentence on this subject is approved, and
      any sentence on this subject fails.
    established: "vault #288 (2026-09-01, measured) and #295 (2026-09-01, MISSED by the class rule)"
    #: ⚠ DELIBERATELY NOT SCOPED. dpa.html, msa.html and terms.html are contract
    #: instruments and the other classes exempt them for good reasons — but the
    #: contract pages are exactly where a BAA clause would be added, and a BAA
    #: clause in a contract is not a forward obligation, it is an assertion that
    #: an instrument exists. Every surface, no exceptions.
    sentence_pattern: '\bBAAs?\b|\bbusiness[\s-]associates?\b|\bcovered entit(?:y|ies)\b'
    approved_sentences: []
    must_match_examples:
      #: ⚠ THE FIRST IS #295's, VERBATIM. It is false today and stays here as
      #: the fixture that proves this class still fires.
      - "We execute Business Associate Agreements with every healthcare customer before any protected health information is processed."
      - "A signed Business Associate Agreement is in place with Google Cloud covering all HIPAA workloads."
      - "Foxy Audit will act as your business associate under HIPAA and sign a BAA on request."
      - "Because Foxy Audit is not a covered entity, no agreement is required before you send PHI."

  security_specifics:
    value: "no algorithm, key-rotation interval or assurance activity may be stated that is not evidenced"
    detail: >-
      #295 injected "All ledger data is encrypted at rest using AES-256 with
      keys rotated every ninety days" and every test stayed green. It is
      unverified in both halves: the ledger is not encrypted at rest with
      AES-256 (the only AES on any surface is Fernet's AES-128-CBC, and it
      protects BYOK provider keys, not ledger data), and no key-rotation
      interval is enforced anywhere.

      ⚠ THE CONSTRUCTION THIS CLASS GUARDS is a security control named together
      with A SPECIFIC A READER COULD HOLD US TO — a named primitive, a rotation
      cadence, or an assurance activity. That is precisely the shape a security
      questionnaire invites and the easiest thing on this site to write from
      memory rather than from evidence. The sentences currently approved are all
      true and several are unflattering, which is the register working: "Not yet
      encrypted at rest: the OIDC client secret and the webhook signing secret
      are currently stored in plaintext" is in this list, and a rewrite that
      quietly drops it fails `test_every_approved_sentence_is_still_on_a_page`.
    established: "vault #295 (2026-09-01, MISSED by the class rule)"
    scope_to: ['foxy-sale-page/privacy.html', 'foxy-sale-page/trust.html']
    #: ⚠ SCOPED TO THE TWO SECURITY-DISCLOSURE PAGES, AND HERE IS WHAT THAT
    #: LEAVES UNCOVERED, MEASURED RATHER THAN GUESSED (2026-09-02, 29 matching
    #: sentences across all surfaces, 13 of them here):
    #:
    #:  · foxy-dashboard/foxy-audit-premium.html — 10 matches, and TEN OUT OF
    #:    TEN ARE JAVASCRIPT. `_prose()` strips tags but not <script> bodies, so
    #:    the flattened page carries its own source: `_rotate_org_key`, a
    #:    confirm-dialog string, a comment about #249. Putting those in a prose
    #:    approval list would make the list unreadable, and an unreadable list
    #:    is one somebody deletes. ⚠ THE COST IS REAL: a false AES claim added
    #:    to the dashboard is not caught by this class. It is written here
    #:    rather than forgotten, which is the only honest thing to do with it.
    #:  · dpa.html, terms.html, acceptable-use.html — contract instruments,
    #:    exempted for the same reason `transfer_safeguards` exempts them.
    #:  · how-it-works.html, sdk.html, hash-chain.html — these describe the
    #:    product's own mechanism (HMAC-SHA-256 commitments, the chain hash) to
    #:    buyers rather than stating a security posture to an assessor.
    sentence_pattern: '\b(?:AES|RSA|ChaCha20|Blowfish|3DES|Triple[- ]?DES|Fernet|PBKDF2|bcrypt|scrypt|Argon2|Ed25519|ECDSA|X25519|SHA-?(?:1|224|256|384|512)|HMAC)\b|\bencrypt\w*[^.]{0,60}\b(?:at rest|in transit)\b|\b(?:at rest|in transit)\b[^.]{0,60}\bencrypt\w*|\b(?:keys?|secrets?|credentials?|certificates?|passwords?)\b[^.]{0,60}\brotat(?:e|es|ed|ing|ion)\b|\brotat(?:e|es|ed|ing|ion)\b[^.]{0,60}\b(?:keys?|secrets?|credentials?|certificates?|passwords?)\b|\bpenetration test\w*|\bpen[- ]test\w*|\bred[- ]team\w*|\bvulnerability scan\w*|\bbug bount\w+'
    approved_sentences:
      - "\"Commitment\" means the SHA-256 or HMAC-SHA-256 cryptographic digest computed from an interaction, on your infrastructure, as described in Section 3 ."
      - "When it observes an interaction, it computes a SHA-256 digest and a customer-keyed HMAC-SHA-256 Commitment of the prompt and response locally, in your own process , before anything is transmitted to us."
      - "API keys — your SDK bearer key is stored only as a salted/peppered HMAC-SHA-256 hash; the plaintext value is displayed once at creation and is not retained by us."
      - "Bring-your-own AI provider keys (\"BYOK\") — where you supply your own Gemini or OpenAI key so our AI judge can grade interactions, the key is encrypted at rest using Fernet symmetric encryption (AES-128 in CBC mode, authenticated with HMAC-SHA-256, random IV per record, bound to the owning organization and provider)."
      - "All traffic to and from the Service is encrypted in transit using TLS."
      - "API keys and one-time passcodes are stored only as salted/peppered SHA-256 or HMAC-SHA-256 hashes."
      - "BYOK provider keys are encrypted at rest using Fernet (AES-128-CBC with HMAC-SHA-256 authentication), bound to the owning organization and provider, with support for key rotation without downtime."
      - "Available on an opt-in basis per account, using an emailed one-time passcode (six digits, single use, five-minute validity, stored only as a SHA-256 hash)."
      - "Encryption In transit: TLS on all traffic to and from the Service."
      - "At rest secrets: API keys and one-time passcodes are stored only as salted/peppered SHA-256 or HMAC-SHA-256 hashes, never in reversible form."
      - "At rest BYOK provider keys: encrypted using Fernet (AES-128-CBC, HMAC-SHA-256 authentication, random IV per record), bound to the owning organization and provider, so a stored credential cannot be replayed into another tenant's row or the wrong provider slot."
      - "Key rotation is supported with zero downtime."
      - "Not yet encrypted at rest: the OIDC client secret and the webhook signing secret are currently stored in plaintext."
    must_match_examples:
      #: ⚠ THE FIRST IS #295's, VERBATIM. The other three each probe a DIFFERENT
      #: limb of the pattern, so loosening any one limb fails here rather than
      #: passing in silence: assurance activity, rotation cadence, algorithm.
      - "All ledger data is encrypted at rest using AES-256 with keys rotated every ninety days."
      - "Independent penetration testing is performed annually by a third-party firm."
      - "Encryption keys are rotated automatically every quarter."
      - "Customer records are protected with RSA-4096 envelope encryption."

# ---------------------------------------------------------------------------
# REGIME WORDS
#
# The vocabulary the guard scans for. Adding a regime word here without adding
# its claim entries below makes the build red, which is the point: a new regime
# cannot appear on a page without someone writing down what backs it.
#
# ⚠ THE SCAN MUST IGNORE data: URIs. These files embed base64 image payloads,
# and the letter sequences `pci`, `PDPL`, `NIST` and `LGPD` occur inside them.
# A naive grep reports claims on pages that make none — C0 measured this.
# ---------------------------------------------------------------------------
regime_words:
  HIPAA:        '\bHIPAA\b|(?<=["''])hipaa(?:_basic)?(?=["''])|\bhipaa\b'
  SOC 2:        '\bSOC ?2\b|(?<=["''])soc2(?=["''])'
  SOC 1:        '\bSOC ?1\b'
  GDPR:         '\bGDPR\b|(?<=["''])gdpr(?:_basic)?(?=["''])|\bgdpr\b'
  EU AI Act:    '\bEU AI Act\b|\bAI Act\b|(?<=["''])eu_ai_act(?=["''])|\beu_ai_act\b'
  NIST AI RMF:  '\bNIST\b|\bAI RMF\b'
  PCI DSS:      '\bPCI[- ]?DSS\b|\bPCI\b|(?<=["''])pci(?=["''])|\bpci\b'
  ISO 27001:    '\bISO ?27001\b'
  CCPA/CPRA:    '\bCCPA\b|\bCPRA\b'
  LGPD:         '\bLGPD\b'
  PIPEDA:       '\bPIPEDA\b'
  PDPA (SG):    '\bPDPA\b'
  PDPL:         '\bPDPL\b'
  Privacy Act:  '\bPrivacy Act 1988\b|\bPrivacy Act\b'
  FedRAMP:      '\bFedRAMP\b'
  SOX:          '(?<=["''])sox(?=["''])|\bSOX\b|\bsox\b'
  Qatar Law 13: '\bLaw No\.? 13\b|\bLaw 13/2016\b|\bPDPPL\b'

# ---------------------------------------------------------------------------
# CLAIMS
#
# One entry per (file, line, regime) site the scanner finds. Every site needs
# one; an unregistered site fails the build.
#
# kind:
#   affirmative   the surface asserts something. MUST carry a backing row.
#   negation      the surface says Foxy does NOT have something. Needs no
#                 backing — a crosswalk row cannot support an absence, and
#                 demanding one would push these sentences off the pages.
#   question      an FAQ heading. Answered by the affirmative entry beside it.
#
# verdict:
#   backed        a crosswalk row supports it as written
