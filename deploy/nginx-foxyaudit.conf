###############################################################################
#                                                                             #
#   ⚠⚠  THIS FILE IS A PRE-CERTBOT TEMPLATE. IT DOES NOT SPEAK HTTPS.  ⚠⚠     #
#                                                                             #
#   Every server block below is `listen 80;` with NO ssl_certificate. The      #
#   file running in production is certbot's REWRITTEN DESCENDANT of this one   #
#   and carries the TLS blocks and the 80→443 redirects.                       #
#                                                                             #
#   COPYING THIS OVER THE LIVE FILE DISCARDS EVERY TLS BLOCK. That is not a    #
#   hypothetical: it took HTTPS down on all four vhosts — foxyaudit.tech,      #
#   app., admin. AND checkout. — on 2026-08-13.                                #
#                                                                             #
#   ⚠ `nginx -t` PASSES ON THE RESULT. What you get is valid nginx that does   #
#   not serve HTTPS, and port 80 keeps answering 200, so the config test and   #
#   a naive health check BOTH report success while the padlock is gone. The    #
#   only check that catches it is `curl -sI https://foxyaudit.tech` — on the   #
#   https:// scheme, from off the box.                                         #
#                                                                             #
#   THE SEQUENCE, IN THIS ORDER:                                              #
#                                                                             #
#     # 1. BACK UP THE LIVE FILE FIRST — it is the only copy of the TLS config #
#     sudo cp /etc/nginx/sites-available/foxyaudit.conf ~/foxyaudit.conf.bak   #
#                                                                             #
#     # 2. install this template                                              #
#     sudo cp deploy/nginx-foxyaudit.conf /etc/nginx/sites-available/foxyaudit.conf
#     sudo ln -s /etc/nginx/sites-available/foxyaudit.conf /etc/nginx/sites-enabled/
#                                                                             #
#     # 3. PUT TLS BACK. Skipping this is the outage. All five names.          #
#     sudo certbot --nginx -d foxyaudit.tech -d www.foxyaudit.tech \           #
#          -d app.foxyaudit.tech -d admin.foxyaudit.tech \                     #
#          -d checkout.foxyaudit.tech                                          #
#                                                                             #
#     # 4. validate, then reload                                              #
#     sudo nginx -t && sudo systemctl reload nginx                             #
#                                                                             #
#     # 5. VERIFY ON THE https SCHEME, not port 80, and by BODY not status     #
#     for h in foxyaudit.tech app.foxyaudit.tech admin.foxyaudit.tech \        #
#              checkout.foxyaudit.tech; do curl -sI "https://$h" | head -1; done
#                                                                             #
#   If step 3 fails, restore the backup from step 1 and reload. Do not leave   #
#   the template installed.                                                   #
#                                                                             #
###############################################################################
#
# foxyaudit.tech vhosts for the SHARED VM's host nginx (which owns 80/443).
# The Foxy backend is published loopback-only at 127.0.0.1:8085 by
# deploy/docker-compose.prod.yml.
#
# THIS FILE IS WHAT ACTUALLY SERVES PRODUCTION. deploy/Caddyfile describes the
# same four sites for a dedicated box, but the caddy service sits behind
# `profiles: ["edge"]` and is not started on the shared VM. When a site changes,
# it changes in BOTH files or the two disagree about what is public.
#
# X-Forwarded-For is OVERWRITTEN with $remote_addr (never appended) — the
# backend trusts this header for rate-limit keys, traffic ip_hash, and the
# admin IP allow-list, so a client must not be able to inject its own.

# ── Site 1 · marketing (static) ──────────────────────────────────────────────
server {
    listen 80;
    server_name foxyaudit.tech www.foxyaudit.tech;

    root /home/devops/foxy-audit/foxy-sale-page;
    index index.html;

    # Installer downloads — served from an OUT-OF-GIT dir so the binaries never
    # bloat the repo or get wiped by the deploy's `git reset --hard`. The release
    # workflow scp's builds here. Create it once on the VM:
    #   mkdir -p /home/devops/foxy-downloads
    location /download/ {
        alias /home/devops/foxy-downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    # RFC 9116 §3. The canonical URL has to be /.well-known/security.txt, but the
    # file is committed as foxy-sale-page/security.txt with NO LEADING DOT and
    # aliased here — so serving it does not depend on whether the static handler
    # hands out dotfiles, which is behaviour we would be relying on rather than
    # stating. Same reasoning as deploy/Caddyfile's rewrite of this path.
    #
    # `alias` to the file rather than a rewrite, matching the `= /config.js`
    # pattern in Site 4: exact-match `=` wins over the `location /` below, so
    # try_files never sees this path and cannot 404 it.
    #
    # Exact-match ONLY. A prefix `location /.well-known/` would shadow
    # /.well-known/acme-challenge/ and break certbot renewal.
    #
    # `types { }` empties the MIME map for this location so `default_type`
    # always wins. Without it the Content-Type would be *inferred* from the
    # aliased file's .txt suffix via mime.types — the right answer for the wrong
    # reason. The RFC requires text/plain, so it is stated, not inferred.
    location = /.well-known/security.txt {
        alias /home/devops/foxy-audit/foxy-sale-page/security.txt;
        types { }
        default_type "text/plain; charset=utf-8";
    }

    location / {
        # ⚠ NOT `/index.html`. This is a static MULTI-PAGE site, not an SPA.
        # A fallback to the homepage answered every unknown URL with 200 OK and
        # the marketing page, which meant /.well-known/security.txt served HTML,
        # /docs served HTML, and no dead link on this domain — human- or
        # crawler-visible — could ever be noticed. Each one was also duplicate
        # content at 200. A missing page is a missing page.
        #
        #   $uri       exact file: /docs.html, /site.css, /security.txt
        #   $uri.html  extensionless: /docs → docs.html. Every one of the 21
        #              pages is a flat *.html file, so this is what makes a
        #              clean URL resolve. desktop/settings_data.py ships
        #              https://foxyaudit.tech/docs and depends on it.
        #   $uri/      directory + `index index.html` above — this is what
        #              serves `/`. ($uri.html cannot catch `/`: /.html is not a
        #              file, so `/` falls through to here, as it must.)
        #   =404       an honest status. nginx's default body: a branded error
        #              page is a design task, not a routing one.
        try_files $uri $uri.html $uri/ =404;
    }
}

# ── Site 2 · customer dashboard (app.) ───────────────────────────────────────
server {
    listen 80;
    server_name app.foxyaudit.tech;

    client_max_body_size 20m;

    location = / {
        return 302 /dashboard;
    }

    # the staff surface is never reachable via the customer hostname
    location /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Site 3 · staff ops console (admin.) ──────────────────────────────────────
server {
    listen 80;
    server_name admin.foxyaudit.tech;

    location = / {
        return 302 /admin/;
    }

    # nothing but the staff surface is served on the admin hostname
    location /admin {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

# ── Site 4 · Paddle checkout (checkout.) ─────────────────────────────────────
# Static only, and deliberately NO proxy_pass: the one origin in this product
# that runs third-party payment script has no route to the API at all.
#
# The CSP below is byte-identical to the one in deploy/Caddyfile and a guard in
# foxy-checkout/test_checkout_page.py fails if they ever drift. THIS one is the
# copy that reaches a customer — the Caddy file is the dedicated-box path and is
# not running. `always` matters: without it nginx omits the header on a 404, and
# a 404 is the normal response for config.js on a deployment that has not been
# configured yet.
server {
    listen 80;
    server_name checkout.foxyaudit.tech;

    root /home/devops/foxy-audit/foxy-checkout;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.paddle.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.paddle.com; font-src 'self' data:; frame-src https://*.paddle.com https://paddle.com; connect-src https://*.paddle.com https://paddle.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A payment step, not a landing page. Keeping it out of search stops expired
    # _ptxn links being indexed and followed later.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The ONE deployment value, served from OUT OF GIT. The deploy runs
    # `git reset --hard origin/main`, so a config.js inside the repo working tree
    # would be destroyed on every push — which is why it lives here instead, the
    # same reasoning as /home/devops/foxy-downloads.
    #
    # `alias` to the file rather than `root`, because the served path and the
    # on-disk path share no suffix. Exact-match `= /config.js` wins over the
    # `location /` below, so try_files never sees it.
    #
    # When the file is absent — every deployment nobody has configured yet —
    # nginx answers a clean 404 and the page shows its unconfigured state. It
    # must NOT fall back to index.html: that would hand the browser HTML to
    # parse as JavaScript.
    #
    # No add_header here on purpose: nginx drops inherited headers in any
    # location that declares one of its own, and this response has to keep the
    # server-level CSP.
    location = /config.js {
        alias /home/devops/foxy-checkout-config/config.js;
    }

    location / {
        # =404, NOT a fallback to /index.html the way the marketing vhost does.
        # A missing asset here is a missing asset, not a reason to serve the
        # page again. Caddy's file_server answers 404 too, so the two edges
        # behave alike.
        try_files $uri $uri/ =404;
    }
}
